<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COROS Studio">
<title>COROS Activity Studio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Archivo+Black&family=Bebas+Neue&family=Cairo:wght@600;700;800;900&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Changa:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@500;700&family=Readex+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #ffffff;
  --mut: rgba(255, 255, 255, 0.6);
  --edge: rgba(255, 255, 255, 0.16);
  --edge-bright: rgba(255, 255, 255, 0.35);
  --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
  --coros: #38bdf8;
  --ok: #00e054;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #07090e; }
body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.5 "Readex Pro", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: 
    radial-gradient(circle at 20% 15%, rgba(125, 165, 205, 0.22) 0%, transparent 50%),
    radial-gradient(circle at 85% 45%, rgba(86, 130, 175, 0.18) 0%, transparent 50%),
    radial-gradient(circle at 40% 85%, rgba(110, 145, 165, 0.15) 0%, transparent 50%),
    #0b1017;
}
main {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 14px 60px;
}
.brand-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 14px;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #7dd3fc;
  box-shadow: 0 0 12px #7dd3fc;
}
h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.01em;
}
[hidden] { display: none !important; }

/* البطاقات الزجاجية بأسلوب Liquid Glass الفاتح */
.panel, .th {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--edge);
  box-shadow: 
    inset 0 1px 1px rgba(255, 255, 255, 0.28),
    0 14px 36px rgba(0, 0, 0, 0.45);
}
.panel {
  border-radius: 28px;
  padding: 16px;
  margin-top: 14px;
  display: grid;
  gap: 14px;
}

/* معاينة البطاقة */
.prev-wrap {
  width: min(68vw, 300px);
  aspect-ratio: 9/16;
  margin: 0 auto;
  border-radius: 32px;
  overflow: hidden;
  border: 1.5px solid var(--edge-bright);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255,255,255,0.4);
  background-color: #161d26;
  background-image: 
    linear-gradient(45deg, #1d2530 25%, transparent 25%), 
    linear-gradient(-45deg, #1d2530 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, #1d2530 75%), 
    linear-gradient(-45deg, transparent 75%, #1d2530 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}
#prev {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  -webkit-touch-callout: default;
}
.hint {
  text-align: center;
  color: var(--mut);
  font-size: 13px;
  margin: 8px 0 2px;
}

/* شريط القوالب */
#strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 4px 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#strip::-webkit-scrollbar { display: none; }
.th {
  flex: 0 0 auto;
  border-radius: 18px;
  padding: 5px;
  color: var(--mut);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.th.on {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25), 0 10px 24px rgba(0, 0, 0, 0.5);
  transform: translateY(-2px);
}
.th canvas {
  display: block;
  width: 66px;
  height: 118px;
  border-radius: 13px;
  background: #141a22;
}
.th span {
  display: block;
  margin-top: 5px;
  font-weight: 600;
}

/* أزرار اللغة ونوع الرياضة */
.lang-pills {
  display: grid;
  grid-template-columns: 1.25fr 1fr 1fr;
  gap: 8px;
}
.sport-pills {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.sport-pill, .lang-pill {
  padding: 10px 6px;
  border-radius: 14px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.05);
  color: var(--mut);
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.sport-pill.active, .lang-pill.active {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
}

/* الحقول والأزرار */
label {
  display: grid;
  gap: 6px;
  font-size: 13px;
  color: var(--mut);
}
.input-group {
  display: flex;
  gap: 8px;
}
.input-group input { flex: 1; }
input[type=text], input[type=date], select {
  font: inherit;
  font-size: 14.5px;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid var(--edge);
  background: rgba(0, 0, 0, 0.35);
  color: #fff;
  width: 100%;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
  outline: none;
  direction: ltr;
  text-align: left;
}
select { direction: rtl; text-align: right; }
select option { background: #12161f; color: #fff; }
input[data-k="title"], input[data-k="tag"], input[data-k="muscleTag"], input[data-k="mainUnit"], .rtl-in {
  direction: auto !important;
  text-align: start !important;
}
input:focus, select:focus { border-color: rgba(255, 255, 255, 0.65); }
input::placeholder { color: rgba(255, 255, 255, 0.32); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
input[type=color] {
  width: 100%;
  height: 42px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.35);
  padding: 4px;
  cursor: pointer;
}
input[type=range] { accent-color: #7dd3fc; width: 100%; }
.file {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  border: 1px dashed rgba(255, 255, 255, 0.35);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.file.coros-file {
  border-color: rgba(125, 211, 252, 0.55);
  background: rgba(125, 211, 252, 0.1);
}
.file input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.chk-row { display: flex; flex-wrap: wrap; gap: 12px; }
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
}
.chk input { width: 18px; height: 18px; accent-color: #7dd3fc; }

/* إدارة الإحصائيات المرنة */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.section-head b { font-size: 14.5px; color: #fff; }
.section-head span { font-size: 12px; color: var(--mut); }
.stats-manager { display: grid; gap: 8px; }
.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: opacity 0.2s, border-color 0.2s;
}
.stat-item.off {
  opacity: 0.42;
  background: rgba(0, 0, 0, 0.2);
  border-color: rgba(255, 255, 255, 0.05);
}
.stat-toggle {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.06);
  color: var(--mut);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.stat-item:not(.off) .stat-toggle {
  background: rgba(125, 211, 252, 0.22);
  border-color: rgba(125, 211, 252, 0.65);
  color: #7dd3fc;
}
.stat-fields {
  flex: 1;
  display: grid;
  grid-template-columns: 1.25fr 0.85fr 0.85fr;
  gap: 6px;
  min-width: 0;
}
.stat-fields input {
  padding: 8px 9px;
  font-size: 13px;
  border-radius: 10px;
}
.stat-del {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid rgba(255, 90, 90, 0.35);
  background: rgba(255, 90, 90, 0.12);
  color: #ff8080;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 4px;
}
.chip-btn {
  padding: 6px 11px;
  border-radius: 99px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.06);
  color: rgba(255, 255, 255, 0.9);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.chip-btn:active { transform: scale(0.96); }

.go {
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  color: #0b1017;
  width: 100%;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  background: linear-gradient(180deg, #ffffff, #dbeafe);
  box-shadow: 0 8px 24px rgba(125, 211, 252, 0.22);
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.go:active { transform: scale(0.98); }
.go:disabled { opacity: 0.5; cursor: wait; }
.go.alt {
  color: #fff;
  border-color: var(--edge-bright);
  background: rgba(255, 255, 255, 0.1);
  box-shadow: none;
}
.go.inline { width: auto; padding: 0 18px; }
#share { margin-top: 16px; }
#msg {
  text-align: center;
  color: #7dd3fc;
  font-size: 13.5px;
  min-height: 20px;
  margin: 8px 0 0;
}
</style>
</head>
<body>
<main>
  <div class="brand-head">
    <span class="brand-dot"></span>
    <h1>COROS Liquid Glass Studio</h1>
  </div>

  <div class="prev-wrap">
    <img id="prev" alt="معاينة بطاقة التمرين">
  </div>
  <p class="hint">تصميم iOS Liquid Glass الحقيقي + منحنى نبض القلب الانسيابي</p>
  <div id="strip"></div>

  <p id="msg"></p>

  <!-- قسم استيراد بيانات COROS -->
  <section class="panel">
    <label>
      رابط تمرين COROS (أو الصق نص التمرين)
      <div class="input-group">
        <input type="text" id="corosUrl" placeholder="https://t.coros.com/... أو الصق نص التمرين" autocomplete="off">
        <button class="go inline" id="fetchBtn" type="button">جلب البيانات</button>
      </div>
    </label>

    <div class="row">
      <label class="file coros-file">
        📍 رفع ملف (.FIT / .GPX / .TCX)
        <input type="file" id="trackFile" accept=".fit,.gpx,.tcx,.json,application/gpx+xml,application/octet-stream">
      </label>
      <label class="file">
        🖼️ رفع صورة خلفية للتمرين
        <input type="file" id="bgFile" accept="image/*">
      </label>
    </div>
  </section>

  <!-- قسم اللغة ونوع الرياضة والرقم الرئيسي -->
  <section class="panel">
    <label>لغة البطاقة (اللغتين معاً / عربي / English)</label>
    <div class="lang-pills">
      <button type="button" class="lang-pill active" data-lang="bi">🌐 اللغتين (جلسة/SET)</button>
      <button type="button" class="lang-pill" data-lang="ar">🇸🇦 عربي بالكامل</button>
      <button type="button" class="lang-pill" data-lang="en">🇬🇧 English</button>
    </div>

    <label>نوع التمرين</label>
    <div class="sport-pills" id="sportPills">
      <button type="button" class="sport-pill active" data-sport="gym">🏋️ حديد / قوة</button>
      <button type="button" class="sport-pill" data-sport="run">🏃 جري</button>
      <button type="button" class="sport-pill" data-sport="bike">🚴 دراجة</button>
      <button type="button" class="sport-pill" data-sport="rope">⚡ نط حبل</button>
    </div>

    <div class="row">
      <label>عنوان التمرين<input type="text" data-k="title" value="UPPER 1" placeholder="UPPER 1 / جري مسائي"></label>
      <label>الجهاز / الوصف الفرعي<input type="text" data-k="tag" value="COROS PACE 4" placeholder="COROS PACE 4"></label>
    </div>

    <div id="gymExtraRow" class="row">
      <label>العضلات المستهدفة / نوع الجلسة<input type="text" data-k="muscleTag" value="تمرين حديد / STRENGTH" placeholder="علوي / UPPER BODY"></label>
      <label>نوع الغراف في البطاقة الرئيسية
        <select data-k="chartMode">
          <option value="hr">📈 منحنى نبض القلب الانسيابي (Heart Rate Graph)</option>
          <option value="route">🗺️ مسار الـ GPS (للدراجة والجري)</option>
        </select>
      </label>
    </div>

    <div class="row-3">
      <label id="lblMainStat">الرقم الرئيسي (الجلسات/المسافة)<input type="text" data-k="dist" value="17" placeholder="17 أو 5.02"></label>
      <label>وحدة الرقم الرئيسي<input type="text" data-k="mainUnit" value="جلسة / SET" class="rtl-in" placeholder="جلسة / SET"></label>
      <label>تاريخ التمرين<input type="date" data-k="date"></label>
    </div>
  </section>

  <!-- قسم التحكم المرن في الإحصائيات -->
  <section class="panel">
    <div class="section-head">
      <b>الإحصائيات المعروضة (حذف / إضافة / تعديل)</b>
      <span>✓ = ظاهر بالبطاقة</span>
    </div>
    <p class="hint" style="margin:0;text-align:right;font-size:12.5px">اضغط على (✓) لإخفاء أو إظهار أي خانة، أو احذفها بـ (✕)، أو أضف خانات جديدة:</p>

    <div id="statsList" class="stats-manager"></div>

    <button type="button" class="go alt" id="addStatBtn">+ إضافة إحصائية مخصصة جديدة</button>

    <div>
      <label style="margin-bottom:6px">إضافة سريعة لخانات إضافية:</label>
      <div class="quick-chips" id="quickChips">
        <button type="button" class="chip-btn" data-id="reps" data-v="164">🏋️ العدات (عدة/REP)</button>
        <button type="button" class="chip-btn" data-id="vol" data-v="4850">🏋️ الحجم (كجم/KG)</button>
        <button type="button" class="chip-btn" data-id="maxhr" data-v="168">❤️ أقصى نبض (Max HR)</button>
        <button type="button" class="chip-btn" data-id="tl" data-v="94">⚡ حمل التدريب (TL)</button>
        <button type="button" class="chip-btn" data-id="cad" data-v="172">👟 الكادينس (Cadence)</button>
        <button type="button" class="chip-btn" data-id="te" data-v="3.4">🔥 التأثير الهوائي (TE)</button>
      </div>
    </div>
  </section>

  <!-- قسم الخطوط والألوان والأبعاد -->
  <section class="panel">
    <div class="row">
      <label>خط الأرقام والإحصائيات
        <select data-k="numFont" id="numFontSel">
          <option value="'Inter', 'Readex Pro', sans-serif">SF / Inter (خط أبل الزجاجي - نفس الصورة)</option>
          <option value="'Readex Pro', 'Inter', sans-serif">Readex Pro (عصري حاد وواضح)</option>
          <option value="'Cairo', 'Inter', sans-serif">Cairo (القاهرة - عربي/رقمي فخم)</option>
          <option value="'Space Grotesk', 'Cairo', sans-serif">Space Grotesk (تقني نظيف)</option>
          <option value="'Chakra Petch', 'Cairo', sans-serif">Chakra Petch (رقمي COROS)</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono (أرقام هندسية)</option>
          <option value="'Bebas Neue', 'Cairo', sans-serif">Bebas Neue (طولي ضخم)</option>
        </select>
      </label>
      <label>خط العناوين والمسميات
        <select data-k="titleFont" id="titleFontSel">
          <option value="'Inter', 'Readex Pro', sans-serif">SF / Inter + Readex (أسلوب iOS الأصلي)</option>
          <option value="'Cairo', 'Inter', sans-serif">Cairo (القاهرة - عربي احترافي)</option>
          <option value="'Alexandria', 'Inter', sans-serif">Alexandria (الإسكندرية - عريض)</option>
          <option value="'Tajawal', 'Inter', sans-serif">Tajawal (تجوال - ناعم)</option>
          <option value="'IBM Plex Sans Arabic', sans-serif">IBM Plex Arabic (رسمي)</option>
        </select>
      </label>
    </div>

    <div class="row-3">
      <label>لون منحنى النبض<input type="color" data-k="accent" value="#7dd3fc"></label>
      <label>شفافية الزجاج<input type="range" min="8" max="42" value="22" data-k="glassOpacity"></label>
      <label>تغميق الخلفية<input type="range" min="0" max="80" value="15" data-k="dark"></label>
    </div>

    <label>إزاحة البطاقة للأسفل (لمنع تغطية أفتار ويوزر الستوري)<input type="range" min="0" max="160" value="35" data-k="safeShift"></label>

    <div class="chk-row">
      <label class="chk"><input type="checkbox" data-k="transparent"> خلفية شفافة (تصدير الويدجتات الزجاجية فقط PNG)</label>
      <label class="chk"><input type="checkbox" data-k="showSafeGuide"> 👁️ إظهار حدود منطقة الستوري الآمنة (للمعاينة)</label>
    </div>
  </section>

  <button class="go" id="share" type="button">حفظ / مشاركة البطاقة (PNG)</button>
</main>

<script>
const W = 1080, H = 1920;

/* قواميس اللغات الثلاث */
const I18N = {
  bi: {
    sports: {
      gym:  { mainLbl: 'الجلسات / TOTAL SETS', mainUnit: 'جلسة / SET', defTitle: 'UPPER 1', badge: 'تمرين حديد / STRENGTH', paceLbl: 'العدات / TOTAL REPS', paceUnit: 'عدة / REP', elevLbl: 'الحجم / VOLUME', elevUnit: 'كجم / KG' },
      run:  { mainLbl: 'المسافة / DISTANCE', mainUnit: 'كم / KM', defTitle: 'OUTDOOR RUN', badge: 'جري / RUN SESSION', paceLbl: 'البيس / AVG PACE', paceUnit: '/كم · KM', elevLbl: 'الارتفاع / ELEV GAIN', elevUnit: 'م / M' },
      bike: { mainLbl: 'المسافة / DISTANCE', mainUnit: 'كم / KM', defTitle: 'ROAD CYCLING', badge: 'دراجة / CYCLING', paceLbl: 'السرعة / AVG SPEED', paceUnit: 'كم/س · KPH', elevLbl: 'الارتفاع / ELEV GAIN', elevUnit: 'م / M' },
      rope: { mainLbl: 'القفزات / TOTAL JUMPS', mainUnit: 'قفزة / JUMP', defTitle: 'JUMP ROPE', badge: 'نط حبل / CARDIO', paceLbl: 'السرعة / AVG RATE', paceUnit: 'ق/د · JPM', elevLbl: 'أعلى تتابع / STREAK', elevUnit: 'قفزة / JUMP' }
    },
    stats: {
      time:  { label: 'الوقت / TIME', unit: '' },

    const row = document.createElement('div');
    row.className = 'stat-item' + (st.on ? '' : ' off');

    tog.className = 'stat-toggle';

    tog.onclick = () => {
      st.on = !st.on;

      sched();

/* دوال الرسم الهندسية */
function rr(c, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function cover(c, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height), iw = w / s, ih = h / s;
  c.drawImage(img, (img.width - iw) / 2, (img.height - ih) / 2, iw, ih, x, y, w, h);
}

function txt(c, s, x, y, size, wt, col, al = 'left', fam = S.titleFont, mw = null) {
  if (s === undefined || s === null || s === '') return;
  const str = String(s);
  const isAr = /[\u0600-\u06FF]/.test(str);
  c.save();
  c.direction = isAr ? 'rtl' : 'ltr';
  c.font = `${wt} ${size}px ${fam}`;
  while (mw && c.measureText(str).width > mw && size > 14) {
    size -= 1.5;
    c.font = `${wt} ${size}px ${fam}`;
  }
  c.fillStyle = col;
  c.textAlign = al;
  c.textBaseline = 'alphabetic';
  c.fillText(str, x, y);
  c.restore();
}

/* =========================================================================
   محرك الخلفية والزجاج السائل المطابق للصورة المرجعية (Pure Frosted Glass UI)
   ========================================================================= */
function drawAtmosphericBackground(c, width, height) {
  if (S.bg) {
    cover(c, S.bg, 0, 0, width, height);
  } else {
    // خلفية ضبابية ناعمة بدرجات الرمادي المزرق الفاتح والأخضر الطبيعي نفس الصورة المرجعية تماماً
    const base = c.createLinearGradient(0, 0, width, height);
    base.addColorStop(0, '#68829e');
    base.addColorStop(0.38, '#4e677f');
    base.addColorStop(0.72, '#344759');
    base.addColorStop(1, '#23313f');
    c.fillStyle = base;
    c.fillRect(0, 0, width, height);

    // إضاءة نافذة ناعمة من الأعلى واليمين
    const light = c.createRadialGradient(width * 0.85, height * 0.18, 20, width * 0.75, height * 0.25, width * 0.9);
    light.addColorStop(0, 'rgba(225, 240, 255, 0.45)');
    light.addColorStop(0.5, 'rgba(180, 210, 235, 0.15)');
    light.addColorStop(1, 'transparent');
    c.fillStyle = light;
    c.fillRect(0, 0, width, height);

    // بوكيه أخضر طبيعي ناعم في الخلفية البعيدة (مثل النبتة المضببة في الصورة)
    const leaf = c.createRadialGradient(width * 0.9, height * 0.42, 10, width * 0.88, height * 0.42, width * 0.45);
    leaf.addColorStop(0, 'rgba(115, 155, 110, 0.28)');
    leaf.addColorStop(1, 'transparent');
    c.fillStyle = leaf;
    c.fillRect(0, 0, width, height);
  }

  if (S.dark > 0) {
    c.fillStyle = `rgba(6, 10, 15, ${S.dark / 100})`;
    c.fillRect(0, 0, width, height);
  }
}

function prepareBlurredBackdrop() {
  const bc = blurCv.getContext('2d');
  bc.clearRect(0, 0, blurCv.width, blurCv.height);
  bc.save();
  bc.filter = 'blur(22px) saturate(140%) brightness(1.06)';
  drawAtmosphericBackground(bc, blurCv.width, blurCv.height);
  bc.restore();
}

/* رسم ويدجت زجاجي ثلجي نقي مطابق للصورة الثانية 100% */
function drawFrostedGlassWidget(c, x, y, w, h, r = 42, extraBright = 0) {
  const baseAlpha = (+S.glassOpacity || 22) / 100 + extraBright;
  c.save();

  // 1) ظل خارجي ناعم جداً يعطي طفو الويدجت
  c.save();
  c.shadowColor = 'rgba(0, 8, 20, 0.28)';
  c.shadowBlur = 36;
  c.shadowOffsetY = 14;
  rr(c, x, y, w, h, r);
  c.fillStyle = 'rgba(255, 255, 255, 0.04)';
  c.fill();
  c.restore();

  // 2) قص منطقة الويدجت ورسم الخلفية المضببة بداخلها
  rr(c, x, y, w, h, r);
  c.clip();
  if (!S.transparent) {
    c.drawImage(blurCv, 0, 0, W, H);
  }

  // 3) طبقة الزجاج الثلجي الأبيض الناعم (Frosted White Tint)
  const frost = c.createLinearGradient(x, y, x + w * 0.4, y + h);
  frost.addColorStop(0, `rgba(255, 255, 255, ${Math.min(0.65, baseAlpha + 0.12)})`);
  frost.addColorStop(0.5, `rgba(255, 255, 255, ${Math.min(0.55, baseAlpha)})`);
  frost.addColorStop(1, `rgba(255, 255, 255, ${Math.min(0.6, baseAlpha + 0.05)})`);
  c.fillStyle = frost;
  c.fillRect(x, y, w, h);

  // 4) لمعة داخلية علوية ناعمة
  const topGlow = c.createLinearGradient(x, y, x, y + Math.min(120, h * 0.45));
  topGlow.addColorStop(0, 'rgba(255, 255, 255, 0.26)');
  topGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
  c.fillStyle = topGlow;
  c.fillRect(x, y, w, Math.min(120, h * 0.45));

  // 5) الحد الزجاجي الأبيض الرقيق جداً (1.8px Crisp White Specular Border)
  const borderGrad = c.createLinearGradient(x, y, x + w, y + h);
  borderGrad.addColorStop(0, 'rgba(255, 255, 255, 0.88)');
  borderGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.38)');
  borderGrad.addColorStop(0.75, 'rgba(255, 255, 255, 0.22)');
  borderGrad.addColorStop(1, 'rgba(255, 255, 255, 0.65)');

  rr(c, x + 1, y + 1, w - 2, h - 2, r - 1);
  c.strokeStyle = borderGrad;
  c.lineWidth = 2.2;
  c.stroke();

  c.restore();
}

/* =========================================================================
   رسم منحنى نبض القلب الانسيابي (Smooth Spline Area Graph - نفس بطاقة 3.2K بالصورة)
   ========================================================================= */
function drawSmoothHeartRateChart(c, gx, gy, gw, gh, strokeCol = S.accent) {
  c.save();

  // استخدام بيانات نبض القلب الحقيقية من ملف FIT أو توليد منحنى تمرين واقعي وناعم
  let pts = S.hrSeries && S.hrSeries.length >= 6
    ? S.hrSeries
    : [96, 104, 112, 108, 122, 134, 128, 142, 138, 152, 146, 158, 149, 162, 155, 166];

  const minV = Math.min(...pts) - 6;
  const maxV = Math.max(...pts) + 6;
  const range = Math.max(12, maxV - minV);

  const coords = pts.map((v, i) => [
    gx + (i / (pts.length - 1)) * gw,
    gy + gh - ((v - minV) / range) * (gh * 0.82) - gh * 0.08
  ]);

  // دالة رسم المنحنى الناعم عبر نقاط التحكم (Catmull-Rom / Quadratic Midpoint Spline)
  function traceSmoothCurve() {
    c.moveTo(coords[0][0], coords[0][1]);
    for (let i = 0; i < coords.length - 1; i++) {
      const xc = (coords[i][0] + coords[i + 1][0]) / 2;
      const yc = (coords[i][1] + coords[i + 1][1]) / 2;
      c.quadraticCurveTo(coords[i][0], coords[i][1], xc, yc);
    }
    const last = coords[coords.length - 1];
    c.lineTo(last[0], last[1]);
  }

  // 1) التعبئة المتدرجة تحت المنحنى (Soft Gradient Fill Under Curve)
  c.save();
  c.beginPath();
  traceSmoothCurve();
  c.lineTo(gx + gw, gy + gh);
  c.lineTo(gx, gy + gh);
  c.closePath();

  const areaGrad = c.createLinearGradient(0, gy, 0, gy + gh);
  areaGrad.addColorStop(0, strokeCol + '77'); // شفافية ناعمة في القمة
  areaGrad.addColorStop(0.75, strokeCol + '18');
  areaGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  c.fillStyle = areaGrad;
  c.fill();
  c.restore();

  // 2) رسم الخط الانسيابي المضيء بالأعلى
  c.beginPath();
  traceSmoothCurve();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 4.2;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.shadowColor = strokeCol;
  c.shadowBlur = 14;
  c.stroke();

  c.restore();
}

/* رسم مسار الـ GPS لو اختار المستخدم وضع الخريطة بدل منحنى النبض */
function drawMiniRoute(c, boxX, boxY, boxW, boxH, color = '#ffffff') {
  c.save();
  const pts = (S.route && S.route.length >= 3) ? S.route : [
    [0.15, 0.75], [0.10, 0.48], [0.22, 0.25], [0.48, 0.14],
    [0.76, 0.20], [0.90, 0.45], [0.82, 0.72], [0.58, 0.86], [0.15, 0.75]
  ];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(([lat, lon]) => {
    if (lon < minX) minX = lon; if (lon > maxX) maxX = lon;
    if (lat < minY) minY = lat; if (lat > maxY) maxY = lat;
  });
  const spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;
  const scale = Math.min(boxW / spanX, boxH / spanY) * 0.82;
  const offX = boxX + (boxW - spanX * scale) / 2;
  const offY = boxY + (boxH - spanY * scale) / 2;

  c.beginPath();
  pts.forEach(([lat, lon], idx) => {
    const px = offX + (lon - minX) * scale;
    const py = offY + (maxY - lat) * scale;
    if (idx === 0) c.moveTo(px, py); else c.lineTo(px, py);
  });
  c.strokeStyle = color;
  c.lineWidth = 5;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.shadowColor = S.accent;
  c.shadowBlur = 14;
  c.stroke();
  c.restore();
}

/* رسم أيقونات صغيرة نظيفة داخل المربعات والدوائر الزجاجية (نفس الصورة المرجعية) */
function drawMiniVectorIcon(c, type, cx, cy, r = 16, col = '#ffffff') {
  c.save();
  c.translate(cx, cy);
  c.strokeStyle = col;
  c.fillStyle = col;
  c.lineWidth = 2.6;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  if (type === 'bars') {
    // أيقونة الأعمدة الصغيرة بجانب Overview
    c.fillRect(-r * 0.7, r * 0.1, 4, r * 0.6);
    c.fillRect(-r * 0.15, -r * 0.4, 4, r * 1.1);
    c.fillRect(r * 0.4, -r * 0.15, 4, r * 0.85);
  } else if (type === 'trend') {
    // أيقونة السهم الصاعد داخل الدائرة
    c.beginPath();
    c.moveTo(-r * 0.55, r * 0.35);
    c.lineTo(-r * 0.1, -r * 0.15);
    c.lineTo(r * 0.15, r * 0.1);
    c.lineTo(r * 0.55, -r * 0.35);
    c.stroke();
    c.beginPath();
    c.moveTo(r * 0.2, -r * 0.35);
    c.lineTo(r * 0.55, -r * 0.35);
    c.lineTo(r * 0.55, 0);
    c.stroke();
  } else if (type === 'heart') {
    c.beginPath();
    c.moveTo(0, r * 0.55);
    c.bezierCurveTo(-r * 0.9, -r * 0.1, -r * 0.5, -r * 0.8, 0, -r * 0.25);
    c.bezierCurveTo(r * 0.5, -r * 0.8, r * 0.9, -r * 0.1, 0, r * 0.55);
    c.fill();
  } else if (type === 'clock') {
    c.beginPath(); c.arc(0, 0, r * 0.75, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(0, -r * 0.45); c.lineTo(0, 0); c.lineTo(r * 0.35, r * 0.2); c.stroke();
  } else if (type === 'flame') {
    c.beginPath();
    c.moveTo(0, -r * 0.75);
    c.quadraticCurveTo(r * 0.7, -r * 0.1, r * 0.45, r * 0.55);
    c.quadraticCurveTo(0, r * 0.85, -r * 0.45, r * 0.55);
    c.quadraticCurveTo(-r * 0.7, -r * 0.1, 0, -r * 0.75);
    c.fill();
  } else if (type === 'dumbbell') {
    c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(-r * 0.55, 0); c.lineTo(r * 0.55, 0); c.stroke();
    c.fillRect(-r * 0.75, -r * 0.45, 4.5, r * 0.9);
    c.fillRect(r * 0.45, -r * 0.45, 4.5, r * 0.9);
  } else if (type === 'check') {
    c.beginPath();
    c.moveTo(-r * 0.45, 0.05);
    c.lineTo(-r * 0.1, r * 0.4);
    c.lineTo(r * 0.5, -r * 0.35);
    c.stroke();
  } else if (type === 'arrowUpRight') {
    c.beginPath();
    c.moveTo(-r * 0.35, r * 0.35);
    c.lineTo(r * 0.35, -r * 0.35);
    c.moveTo(-r * 0.05, -r * 0.35);
    c.lineTo(r * 0.35, -r * 0.35);
    c.lineTo(r * 0.35, r * 0.05);
    c.stroke();
  }
  c.restore();
}

function getCardState() {
  const dict = I18N[S.lang];
  const cfg = dict.sports[S.sport] || dict.sports.gym;
  let dStr = '';
  if (S.date) {
    const dObj = new Date(S.date + 'T12:00:00');
    if (S.lang === 'ar') {
      dStr = dObj.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric' });
    } else if (S.lang === 'bi') {
      const arM = dObj.toLocaleDateString('ar-SA', { day: 'numeric', month: 'short' });
      const enM = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
      dStr = `${arM} · ${enM}`;
    } else {
      dStr = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
    }
  }
  const activeStats = S.stats.filter(x => x.on);
  return {
    dict,
    cfg,
    title: S.title || cfg.defTitle,
    dateStr: dStr,
    dist: S.dist || (S.sport === 'gym' ? '17' : '5.02'),
    mainLbl: S.mainLbl || cfg.mainLbl,
    mainUnit: S.mainUnit || cfg.mainUnit,
    activeStats
  };
}

function drawStorySafeOverlay(c) {

  c.fillStyle = 'rgba(255, 60, 60, 0.18)';

  c.fillRect(0, 1710, W, 210);

  c.strokeStyle = 'rgba(255, 90, 90, 0.75)';

  c.beginPath();
  c.moveTo(0, 240 + S.safeShift); c.lineTo(W, 240 + S.safeShift);
  c.moveTo(0, 1710); c.lineTo(W, 1710);

}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDuration(sec) {
  if (!sec || sec <= 0) return '';
  const hrs = Math.floor(sec / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  const s = Math.round(sec % 60);
  if (hrs > 0) return `${hrs}:${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${mins}:${String(s).padStart(2, '0')}`;
}

function formatPace(secPerKm) {
  if (!secPerKm || !isFinite(secPerKm) || secPerKm <= 0) return '';
  const m = Math.floor(secPerKm / 60);
  const s = Math.round(secPerKm % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

/* =========================================================================
   قارئ ملفات .FIT الدقيق (يستخرج منحنى نبض القلب الحقيقي + الوقت الصافي + الجلسات النشطة)
   ========================================================================= */
function parseFitBuffer(buf) {
  const view = new DataView(buf);
  if (view.byteLength < 14) return null;
  const hdrSize = view.getUint8(0);
  const dataLen = view.getUint32(4, true);
  let pos = hdrSize;
  const end = Math.min(view.byteLength, hdrSize + dataLen);
  const defs = {};
  const pts = [];
  const rawHrList = [];
  let hrSum = 0, hrCnt = 0, cadSum = 0, cadCnt = 0, pwrSum = 0, pwrCnt = 0;
  let minTs = null, maxTs = null, prevRecTs = null, movingRecSec = 0;
  let lastAlt = null, elevGain = 0, maxDist = 0;

  let fitSport = null, fitSubSport = null;
  let sessionTimerSec = 0;
  let sessionDistKm = 0;
  let sessionCalories = 0;
  let sessionAvgHr = 0;
  let sessionAscent = 0;

  let activeSetsCount = 0;
  let totalRepsCount = 0;
  let totalVolumeKg = 0;
  let activeLapsCount = 0;

  while (pos < end) {
    const hdr = view.getUint8(pos++);
    if (hdr & 0x80) continue;
    const isDef = (hdr & 0x40) !== 0;
    const hasDev = (hdr & 0x20) !== 0;
    const localNum = hdr & 0x0f;

    if (isDef) {
      pos++;
      const arch = view.getUint8(pos++);
      const le = arch === 0;
      const gMsg = view.getUint16(pos, le); pos += 2;
      const nFields = view.getUint8(pos++);
      const fields = [];
      for (let i = 0; i < nFields; i++) {
        fields.push({ num: view.getUint8(pos), size: view.getUint8(pos + 1), type: view.getUint8(pos + 2) });
        pos += 3;
      }
      if (hasDev) {
        const nDev = view.getUint8(pos++);
        for (let i = 0; i < nDev; i++) {
          fields.push({ num: -1, size: view.getUint8(pos + 1), type: 0 });
          pos += 3;
        }
      }
      defs[localNum] = { gMsg, le, fields };
    } else {
      const def = defs[localNum];
      if (!def) break;
      let lat = null, lon = null;
      let setType = null, setReps = null, setWeight = 0;
      let lapIntensity = null;

      for (const f of def.fields) {
        if (pos + f.size > end) { pos = end; break; }

        if (def.gMsg === 18) {
          if (f.num === 5 && f.size === 1) fitSport = view.getUint8(pos);
          else if (f.num === 6 && f.size === 1) fitSubSport = view.getUint8(pos);
          else if (f.num === 8 && f.size === 4) {
            const t = view.getUint32(pos, def.le);
            if (t !== 0xFFFFFFFF && t > 0) sessionTimerSec = t / 1000;
          } else if (f.num === 9 && f.size === 4) {
            const d = view.getUint32(pos, def.le);
            if (d !== 0xFFFFFFFF && d > 0) sessionDistKm = d / 100000;
          } else if (f.num === 11 && f.size === 2) {
            const c = view.getUint16(pos, def.le);
            if (c !== 0xFFFF) sessionCalories = c;
          } else if (f.num === 16 && f.size === 1) {
            const h = view.getUint8(pos);
            if (h !== 0xFF && h > 30) sessionAvgHr = h;
          } else if (f.num === 22 && f.size === 2) {
            const asc = view.getUint16(pos, def.le);
            if (asc !== 0xFFFF) sessionAscent = asc;
          }
        }
        else if (def.gMsg === 225) {
          if (f.num === 0 && f.size === 1) {
            const st = view.getUint8(pos);
            if (st !== 0xFF) setType = st;
          } else if (f.num === 3 && f.size === 2) {
            const r = view.getUint16(pos, def.le);
            if (r !== 0xFFFF) setReps = r;
          } else if (f.num === 4 && f.size === 2) {
            const w = view.getUint16(pos, def.le);
            if (w !== 0xFFFF) setWeight = w / 16;
          }
        }
        else if (def.gMsg === 19) {
          if (f.num === 23 && f.size === 1) {
            const inten = view.getUint8(pos);
            if (inten !== 0xFF) lapIntensity = inten;
          }
        }
        else if (def.gMsg === 20) {
          if (f.num === 253 && f.size === 4) {
            const ts = view.getUint32(pos, def.le);
            if (ts !== 0xFFFFFFFF) {
              if (!minTs) minTs = ts;
              maxTs = ts;
              if (prevRecTs !== null) {
                const delta = ts - prevRecTs;
                if (delta > 0 && delta <= 15) movingRecSec += delta;
              }
              prevRecTs = ts;
            }
          } else if (f.num === 0 && f.size === 4) {
            const v = view.getInt32(pos, def.le);
            if (v !== 0x7FFFFFFF) lat = v * (180 / 2147483648);
          } else if (f.num === 1 && f.size === 4) {
            const v = view.getInt32(pos, def.le);
            if (v !== 0x7FFFFFFF) lon = v * (180 / 2147483648);
          } else if (f.num === 2 && f.size === 2) {
            const v = view.getUint16(pos, def.le);
            if (v !== 0xFFFF) {
              const alt = v / 5 - 500;
              if (lastAlt !== null && alt > lastAlt) elevGain += (alt - lastAlt);
              lastAlt = alt;
            }
          } else if (f.num === 3 && f.size === 1) {
            const v = view.getUint8(pos);
            if (v !== 0xFF && v > 35 && v < 240) {
              hrSum += v;
              hrCnt++;
              rawHrList.push(v);
            }
          } else if (f.num === 4 && f.size === 1) {
            const v = view.getUint8(pos);
            if (v !== 0xFF && v > 0) { cadSum += v; cadCnt++; }
          } else if (f.num === 5 && f.size === 4) {
            const v = view.getUint32(pos, def.le);
            if (v !== 0xFFFFFFFF) maxDist = Math.max(maxDist, v / 100);
          } else if (f.num === 7 && f.size === 2) {
            const v = view.getUint16(pos, def.le);
            if (v !== 0xFFFF && v > 0) { pwrSum += v; pwrCnt++; }
          }
        }
        pos += f.size;
      }

      if (def.gMsg === 225) {
        const isActiveSet = (setType === 1) || (setType === null && setReps !== null && setReps > 0);
        if (isActiveSet) {
          activeSetsCount++;
          const repsVal = setReps || 0;
          totalRepsCount += repsVal;
          if (setWeight > 0 && repsVal > 0) totalVolumeKg += (setWeight * repsVal);
        }
      }

      if (def.gMsg === 19 && lapIntensity === 0) {
        activeLapsCount++;
      }

      if (lat !== null && lon !== null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
        pts.push([lat, lon]);
      }
    }
  }

  // تنعيم وتلخيص نقاط نبض القلب في 22 نقطة لرسم منحنى حريري مثل الصورة
  let smoothedHr = [];
  if (rawHrList.length >= 8) {
    const buckets = 20;
    const chunk = rawHrList.length / buckets;
    for (let i = 0; i < buckets; i++) {
      const start = Math.floor(i * chunk);
      const endIdx = Math.max(start + 1, Math.floor((i + 1) * chunk));
      const slice = rawHrList.slice(start, endIdx);
      const avg = slice.reduce((a, b) => a + b, 0) / slice.length;
      smoothedHr.push(Math.round(avg));
    }
  }

  const finalSets = activeSetsCount > 0 ? activeSetsCount : activeLapsCount;
  const isStrength = (fitSport === 10 || fitSubSport === 20 || activeSetsCount > 0);
  const finalDurationSec = sessionTimerSec > 0 ? sessionTimerSec : (movingRecSec > 0 ? movingRecSec : ((minTs && maxTs) ? (maxTs - minTs) : 0));
  const finalDistKm = sessionDistKm > 0 ? sessionDistKm : (maxDist > 0 ? maxDist / 1000 : 0);

  return {
    isStrength,
    fitSport,
    activeSets: finalSets,
    totalReps: totalRepsCount,
    totalVolumeKg: Math.round(totalVolumeKg),
    sessionCalories,
    pts,
    hrSeries: smoothedHr,
    maxHr: rawHrList.length ? Math.max(...rawHrList) : 0,
    minHr: rawHrList.length ? Math.min(...rawHrList) : 0,
    distKm: finalDistKm,
    durationSec: Math.round(finalDurationSec),
    startEpochMs: minTs ? (minTs + 631065600) * 1000 : null,
    avgHr: sessionAvgHr > 0 ? sessionAvgHr : (hrCnt ? Math.round(hrSum / hrCnt) : 0),
    avgCad: cadCnt ? Math.round(cadSum / cadCnt) : 0,
    avgPwr: pwrCnt ? Math.round(pwrSum / pwrCnt) : 0,
    elevGain: sessionAscent > 0 ? sessionAscent : Math.round(elevGain)
  };
}

/* رفع وقراءة ملفات التمرين (.FIT / .GPX / .TCX) */
$('trackFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  msg.textContent = 'جاري تحليل ملف التمرين ورسم منحنى نبض القلب...';

  try {
    if (f.name.toLowerCase().endsWith('.fit')) {
      const buf = await f.arrayBuffer();
      const res = parseFitBuffer(buf);
      if (res) {
        if (res.hrSeries && res.hrSeries.length >= 6) {
          S.hrSeries = res.hrSeries;
          S.maxHrVal = res.maxHr;
          S.minHrVal = res.minHr;
        }
        if (res.isStrength) {
          applySportMode('gym');
          S.dist = String(res.activeSets || 17);
          if (res.totalReps > 0) setStatValue('pace', res.totalReps);
          if (res.totalVolumeKg > 0) setStatValue('elev', res.totalVolumeKg);
        } else {
          if (res.fitSport === 2) applySportMode('bike');
          else applySportMode('run');

          if (res.pts.length > 1) {
            const step = Math.max(1, Math.floor(res.pts.length / 250));
            S.route = res.pts.filter((_, idx) => idx % step === 0);
          }
          if (res.distKm > 0) S.dist = res.distKm.toFixed(2);
          if (res.elevGain > 0) setStatValue('elev', res.elevGain);
        }

        if (res.durationSec > 0) {
          setStatValue('time', formatDuration(res.durationSec));
          if (!res.isStrength && res.distKm > 0) {
            const pVal = S.sport === 'bike'
              ? (res.distKm / (res.durationSec / 3600)).toFixed(1)
              : formatPace(res.durationSec / res.distKm);
            setStatValue('pace', pVal);
          }
        }
        if (res.avgHr > 0) setStatValue('hr', res.avgHr);
        if (res.sessionCalories > 0) setStatValue('cal', res.sessionCalories);
        if (res.startEpochMs) S.date = new Date(res.startEpochMs).toISOString().slice(0, 10);

        e.target.parentNode.childNodes[0].nodeValue = '✓ تم استخراج النبض والبيانات';
        msg.textContent = `تم رسم منحنى نبض القلب واستخراج التمرين الصافي (${formatDuration(res.durationSec)})!`;
        syncInputsFromState();
        return;
      }
    }

    const text = await f.text();
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    let trkpts = [...doc.querySelectorAll('trkpt')];
    const pts = [], rawHr = [];
    let elevGain = 0, lastEle = null;
    let hrSum = 0, hrCount = 0;
    let firstTime = null, prevTime = null, movingSec = 0;

    if (trkpts.length) {
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        if (!isNaN(lat) && !isNaN(lon)) pts.push([lat, lon]);
        const eleEl = pt.querySelector('ele');
        if (eleEl) {
          const ele = parseFloat(eleEl.textContent);
          if (!isNaN(ele)) {
            if (lastEle !== null && ele > lastEle) elevGain += (ele - lastEle);
            lastEle = ele;
          }
        }
        const tEl = pt.querySelector('time');
        if (tEl) {
          const ts = Date.parse(tEl.textContent);
          if (!isNaN(ts)) {
            if (!firstTime) firstTime = ts;
            if (prevTime !== null) {
              const dt = (ts - prevTime) / 1000;
              if (dt > 0 && dt <= 15) movingSec += dt;
            }
            prevTime = ts;
          }
        }
        const hrEl = pt.getElementsByTagName('gpxtpx:hr')[0] || pt.getElementsByTagName('ns3:hr')[0] || pt.querySelector('hr');
        if (hrEl) {
          const h = parseFloat(hrEl.textContent);
          if (!isNaN(h) && h > 35) { hrSum += h; hrCount++; rawHr.push(h); }
        }
      });
    }

    if (rawHr.length >= 8) {
      const buckets = 20, chunk = rawHr.length / buckets;
      S.hrSeries = Array.from({ length: buckets }, (_, i) => {
        const sl = rawHr.slice(Math.floor(i * chunk), Math.max(Math.floor(i * chunk) + 1, Math.floor((i + 1) * chunk)));
        return Math.round(sl.reduce((a, b) => a + b, 0) / sl.length);
      });
    }

    if (pts.length > 1) {
      const step = Math.max(1, Math.floor(pts.length / 250));
      S.route = pts.filter((_, idx) => idx % step === 0);
      let totalKm = 0;
      for (let i = 1; i < pts.length; i++) totalKm += haversineKm(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
      if (totalKm > 0) S.dist = totalKm.toFixed(2);
      if (movingSec > 0) {
        setStatValue('time', formatDuration(movingSec));
        if (totalKm > 0) setStatValue('pace', S.sport === 'bike' ? (totalKm / (movingSec / 3600)).toFixed(1) : formatPace(movingSec / totalKm));
        if (firstTime) S.date = new Date(firstTime).toISOString().slice(0, 10);
      }
      if (elevGain > 0) setStatValue('elev', Math.round(elevGain));
      if (hrCount > 0) setStatValue('hr', Math.round(hrSum / hrCount));
      e.target.parentNode.childNodes[0].nodeValue = '✓ تم استخراج البيانات';
      msg.textContent = 'تم استخراج البيانات ومنحنى النبض بنجاح!';
      syncInputsFromState();
    }
  } catch (err) {
    msg.textContent = 'تعذر قراءة الملف، تأكد أنه بصيغة FIT أو GPX أو TCX.';
  }
};

function parseCorosTextOrHtml(raw) {
  if (!raw) return false;
  let found = false;

  const setsMatch = raw.match(/(\d{1,3})\s*(?:sets|set|جلسات|جلسة|جولات)/i);
  const repsMatch = raw.match(/(\d{1,4})\s*(?:reps|rep|عدات|عدة|تكرار)/i);
  const isStrengthText = /strength|gym|weight|muscle|حديد|مقاومة|قوة/i.test(raw) || (setsMatch && repsMatch);

  if (isStrengthText) {
    applySportMode('gym');
    if (setsMatch) { S.dist = setsMatch[1]; found = true; }
    if (repsMatch) { setStatValue('pace', repsMatch[1]); found = true; }
    const volMatch = raw.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|كجم|كغ)/i);
    if (volMatch) { setStatValue('elev', volMatch[1].replace(',', '')); found = true; }
  } else {
    const distMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:km|كم|kilometers)/i);
    if (distMatch) { S.dist = distMatch[1]; found = true; }
    const paceMatch = raw.match(/(\d{1,2})['’:](\d{2})(?:"|”)?\s*(?:\/km|\/كم|min\/km)?/i);
    if (paceMatch) { setStatValue('pace', `${paceMatch[1]}:${paceMatch[2]}`); found = true; }
  }

  const curPace = (S.stats.find(x => x.id === 'pace') || {}).val;
  const timeMatches = [...raw.matchAll(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/g)].map(m => m[1]);
  const durCandidate = timeMatches.find(t => t !== curPace && t.length >= 4);
  if (durCandidate) { setStatValue('time', durCandidate.replace(/^00:/, '')); found = true; }

  const hrMatch = raw.match(/(\d{2,3})\s*(?:bpm|نبضة)/i);
  if (hrMatch) { setStatValue('hr', hrMatch[1]); found = true; }

  const calMatch = raw.match(/(\d{2,4})\s*(?:kcal|cal|سعرة)/i);
  if (calMatch) { setStatValue('cal', calMatch[1]); found = true; }

  const tlMatch = raw.match(/(?:load|tl|حمل التدريب)[^\d]{0,10}(\d{1,3})/i);
  if (tlMatch) { setStatValue('tl', tlMatch[1]); found = true; }

  if (found) syncInputsFromState();
  return found;
}

$('fetchBtn').onclick = async () => {
  const val = $('corosUrl').value.trim();
  if (!val) { msg.textContent = 'الصق رابط التمرين أو نص التمرين أولاً.'; return; }

  if (!/^https?:\/\//i.test(val) && parseCorosTextOrHtml(val)) {
    msg.textContent = 'تم تعبئة إحصائيات التمرين تلقائياً!';
    return;
  }

  const urlMatch = val.match(/https?:\/\/[^\s]+/i);
  const targetUrl = urlMatch ? urlMatch[0] : val;

  msg.textContent = 'جاري جلب بيانات التمرين من رابط COROS...';
  $('fetchBtn').disabled = true;

  const endpoints = [
    `https://r.jina.ai/${targetUrl}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
  ];

  let fetchedText = '';
  for (const ep of endpoints) {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 7500);
      const r = await fetch(ep, { signal: ctl.signal });
      clearTimeout(to);
      if (r.ok) {
        const t = await r.text();
        if (t && t.length > 40) {
          fetchedText += '\n' + t;
          if (parseCorosTextOrHtml(fetchedText)) break;
        }
      }
    } catch (e) {}
  }

  $('fetchBtn').disabled = false;

  if (parseCorosTextOrHtml(fetchedText) || parseCorosTextOrHtml(val)) {
    msg.textContent = 'تم جلب إحصائيات التمرين وتعبئتها!';
  } else {
    msg.textContent = 'رابط COROS محمي؛ ارفع ملف (.FIT أو .GPX) من تطبيق COROS أو عدل الخانات بالأسفل.';
  }
};

    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = 'coros-liquid-glass.png';
      a.click();
      msg.textContent = 'تم بدء التنزيل بصيغة PNG.';
    }
  } catch (err) {
    msg.textContent = 'اضغط مطولاً على البطاقة بالأعلى واختر "حفظ الصورة".';
  }
};

renderStatsManager();
render();
</script>
</body>
