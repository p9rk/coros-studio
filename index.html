<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030304">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COROS Studio">
<title>COROS Activity Studio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Archivo+Black&family=Bebas+Neue&family=Cairo:wght@600;700;800;900&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Changa:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;700&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@500;700&family=Readex+Pro:wght@500;700&family=Space+Grotesk:wght@500;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #ffffff;
  --mut: rgba(255, 255, 255, 0.55);
  --edge: rgba(255, 255, 255, 0.14);
  --edge-bright: rgba(255, 255, 255, 0.32);
  --glass-bg: linear-gradient(145deg, rgba(26, 26, 32, 0.72), rgba(10, 10, 14, 0.88));
  --coros: #ff5500;
  --ok: #00e054;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #030304; }
body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.5 "Readex Pro", "Tajawal", -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: 
    radial-gradient(circle at 50% 0%, rgba(255, 85, 0, 0.09) 0%, transparent 55%),
    radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.05) 0%, transparent 45%),
    radial-gradient(circle at 15% 85%, rgba(255, 255, 255, 0.04) 0%, transparent 45%),
    #030304;
}
main {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 14px 60px;
}
.brand-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 14px;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--coros);
  box-shadow: 0 0 12px var(--coros);
}
h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.01em;
}
[hidden] { display: none !important; }

/* البطاقات الزجاجية بأسلوب Liquid Glass */
.panel, .th {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--edge);
  box-shadow: 
    inset 0 1px 1px rgba(255, 255, 255, 0.25),
    inset 0 -1px 1px rgba(255, 255, 255, 0.05),
    0 14px 36px rgba(0, 0, 0, 0.78);
}
.panel {
  border-radius: 28px;
  padding: 16px;
  margin-top: 14px;
  display: grid;
  gap: 14px;
}

/* معاينة البطاقة */
.prev-wrap {
  width: min(64vw, 285px);
  aspect-ratio: 9/16;
  margin: 0 auto;
  border-radius: 26px;
  overflow: hidden;
  border: 1px solid var(--edge-bright);
  box-shadow: 0 22px 55px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255,255,255,0.3);
  background-color: #08080a;
  background-image: 
    linear-gradient(45deg, #121216 25%, transparent 25%), 
    linear-gradient(-45deg, #121216 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, #121216 75%), 
    linear-gradient(-45deg, transparent 75%, #121216 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}
#prev {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  -webkit-touch-callout: default;
}
.hint {
  text-align: center;
  color: var(--mut);
  font-size: 13px;
  margin: 8px 0 2px;
}

/* شريط القوالب */
#strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 4px 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#strip::-webkit-scrollbar { display: none; }
.th {
  flex: 0 0 auto;
  border-radius: 18px;
  padding: 5px;
  color: var(--mut);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.th.on {
  color: #fff;
  border-color: var(--coros);
  box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.6);
  transform: translateY(-2px);
}
.th canvas {
  display: block;
  width: 66px;
  height: 118px;
  border-radius: 13px;
  background: #0b0c10;
}
.th span {
  display: block;
  margin-top: 5px;
  font-weight: 600;
}

/* أزرار اللغة ونوع الرياضة */
.lang-pills {
  display: grid;
  grid-template-columns: 1.25fr 1fr 1fr;
  gap: 8px;
}
.sport-pills {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.sport-pill, .lang-pill {
  padding: 10px 6px;
  border-radius: 14px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.04);
  color: var(--mut);
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.sport-pill.active, .lang-pill.active {
  background: rgba(255, 85, 0, 0.18);
  color: #fff;
  border-color: var(--coros);
  box-shadow: 0 0 14px rgba(255, 85, 0, 0.22);
}

/* الحقول والأزرار */
label {
  display: grid;
  gap: 6px;
  font-size: 13px;
  color: var(--mut);
}
.input-group {
  display: flex;
  gap: 8px;
}
.input-group input { flex: 1; }
input[type=text], input[type=date], select {
  font: inherit;
  font-size: 14.5px;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid var(--edge);
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  width: 100%;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  outline: none;
  direction: ltr;
  text-align: left;
}
select { direction: rtl; text-align: right; }
select option { background: #121214; color: #fff; }
input[data-k="title"], input[data-k="tag"], input[data-k="muscleTag"], input[data-k="mainUnit"], .rtl-in {
  direction: auto !important;
  text-align: start !important;
}
input:focus, select:focus { border-color: rgba(255, 85, 0, 0.65); }
input::placeholder { color: rgba(255, 255, 255, 0.28); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
input[type=color] {
  width: 100%;
  height: 42px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.55);
  padding: 4px;
  cursor: pointer;
}
input[type=range] { accent-color: var(--coros); width: 100%; }
.file {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  border: 1px dashed rgba(255, 255, 255, 0.28);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.03);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.file.coros-file {
  border-color: rgba(255, 85, 0, 0.45);
  background: rgba(255, 85, 0, 0.07);
}
.file input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.chk-row { display: flex; flex-wrap: wrap; gap: 12px; }
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
}
.chk input { width: 18px; height: 18px; accent-color: var(--coros); }

/* إدارة الإحصائيات المرنة */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.section-head b { font-size: 14.5px; color: #fff; }
.section-head span { font-size: 12px; color: var(--mut); }
.stats-manager { display: grid; gap: 8px; }
.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: opacity 0.2s, border-color 0.2s;
}
.stat-item.off {
  opacity: 0.45;
  background: rgba(0, 0, 0, 0.25);
  border-color: rgba(255, 255, 255, 0.05);
}
.stat-toggle {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: var(--mut);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.stat-item:not(.off) .stat-toggle {
  background: rgba(0, 224, 84, 0.16);
  border-color: rgba(0, 224, 84, 0.5);
  color: var(--ok);
}
.stat-fields {
  flex: 1;
  display: grid;
  grid-template-columns: 1.25fr 0.85fr 0.85fr;
  gap: 6px;
  min-width: 0;
}
.stat-fields input {
  padding: 8px 9px;
  font-size: 13px;
  border-radius: 10px;
}
.stat-del {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid rgba(255, 70, 70, 0.3);
  background: rgba(255, 70, 70, 0.1);
  color: #ff6b6b;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 4px;
}
.chip-btn {
  padding: 6px 11px;
  border-radius: 99px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.85);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.chip-btn:active { transform: scale(0.96); }
.chip-btn.gym-chip {
  border-color: rgba(255, 85, 0, 0.4);
  background: rgba(255, 85, 0, 0.1);
}

.go {
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  color: #fff;
  width: 100%;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid rgba(255, 120, 50, 0.6);
  background: linear-gradient(180deg, #ff661a, #e04400);
  box-shadow: 0 6px 20px rgba(255, 85, 0, 0.25);
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.go:active { transform: scale(0.98); }
.go:disabled { opacity: 0.5; cursor: wait; }
.go.alt {
  color: #fff;
  border-color: var(--edge-bright);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: none;
}
.go.inline { width: auto; padding: 0 18px; }
#share { margin-top: 16px; }
#msg {
  text-align: center;
  color: #ff9f0a;
  font-size: 13.5px;
  min-height: 20px;
  margin: 8px 0 0;
}
</style>
</head>
<body>
<main>
  <div class="brand-head">
    <span class="brand-dot"></span>
    <h1>COROS Activity Studio Pro</h1>
  </div>

  <div class="prev-wrap">
    <img id="prev" alt="معاينة بطاقة التمرين">
  </div>
  <p class="hint">ثيمات iOS Liquid Glass + دعم اللغتين معاً (جلسة / SET) + أبعاد آمنة للستوري</p>
  <div id="strip"></div>

  <p id="msg"></p>

  <!-- قسم استيراد بيانات COROS -->
  <section class="panel">
    <label>
      رابط تمرين COROS (أو الصق نص التمرين)
      <div class="input-group">
        <input type="text" id="corosUrl" placeholder="https://t.coros.com/... أو الصق نص التمرين" autocomplete="off">
        <button class="go inline" id="fetchBtn" type="button">جلب البيانات</button>
      </div>
    </label>

    <div class="row">
      <label class="file coros-file">
        📍 رفع ملف (.FIT / .GPX / .TCX)
        <input type="file" id="trackFile" accept=".fit,.gpx,.tcx,.json,application/gpx+xml,application/octet-stream">
      </label>
      <label class="file">
        🖼️ رفع صورة خلفية للتمرين
        <input type="file" id="bgFile" accept="image/*">
      </label>
    </div>
  </section>

  <!-- قسم اللغة ونوع الرياضة والرقم الرئيسي -->
  <section class="panel">
    <label>لغة البطاقة (عربي + إنجليزي معاً / عربي / English)</label>
    <div class="lang-pills">
      <button type="button" class="lang-pill active" data-lang="bi">🌐 اللغتين (جلسة/SET)</button>
      <button type="button" class="lang-pill" data-lang="ar">🇸🇦 عربي بالكامل</button>
      <button type="button" class="lang-pill" data-lang="en">🇬🇧 English</button>
    </div>

    <label>نوع التمرين (يغير العلامة والرسومات تلقائياً)</label>
    <div class="sport-pills" id="sportPills">
      <button type="button" class="sport-pill active" data-sport="run">🏃 جري</button>
      <button type="button" class="sport-pill" data-sport="bike">🚴 دراجة</button>
      <button type="button" class="sport-pill" data-sport="gym">🏋️ حديد / قوة</button>
      <button type="button" class="sport-pill" data-sport="rope">⚡ نط حبل</button>
    </div>

    <div class="row">
      <label>عنوان التمرين<input type="text" data-k="title" value="" placeholder="تمرين حديد / STRENGTH"></label>
      <label>الجهاز / الكابتن<input type="text" data-k="tag" value="COROS PACE 4" placeholder="COROS PACE 4"></label>
    </div>

    <!-- خيار خاص يظهر لتوضيح تمرين الحديد والعضلات المستهدفة -->
    <div id="gymExtraRow" class="row" hidden>
      <label>العضلات المستهدفة (تظهر كعلامة)<input type="text" data-k="muscleTag" value="تمرين حديد / STRENGTH" placeholder="علوي / UPPER BODY"></label>
      <label>شكل علامة الحديد بالبطاقة
        <select data-k="gymBadgeStyle">
          <option value="dumbbell">🏋️ أيقونة دامبل + شارة القوة</option>
          <option value="plate">⚙️ قرص أوزان (Weight Plate)</option>
          <option value="bolt">⚡ شارة طاقة حديدية</option>
        </select>
      </label>
    </div>

    <div class="row-3">
      <label id="lblMainStat">الرقم الرئيسي (المسافة/الجلسات)<input type="text" data-k="dist" value="" placeholder="5.02 أو 17"></label>
      <label>وحدة الرقم الرئيسي<input type="text" data-k="mainUnit" value="كم / KM" class="rtl-in" placeholder="كم/KM أو جلسة/SET"></label>
      <label>تاريخ التمرين<input type="date" data-k="date"></label>
    </div>
    <div class="chk-row">
      <label class="chk"><input type="checkbox" data-k="showMain" checked> إظهار الرقم الرئيسي الكبير</label>
      <label class="chk"><input type="checkbox" data-k="showSportIcon" checked> إظهار علامة نوع الرياضة (حديد/جري/دراجة)</label>
    </div>
  </section>

  <!-- قسم التحكم المرن في الإحصائيات (إخفاء / إظهار / إضافة / حذف) -->
  <section class="panel">
    <div class="section-head">
      <b>الإحصائيات المعروضة (حذف / إضافة / تعديل)</b>
      <span>✓ = ظاهر بالبطاقة</span>
    </div>
    <p class="hint" style="margin:0;text-align:right;font-size:12.5px">اضغط على (✓) لإخفاء أو إظهار أي خانة، أو احذفها بـ (✕)، أو أضف خانات جديدة:</p>

    <div id="statsList" class="stats-manager"></div>

    <button type="button" class="go alt" id="addStatBtn">+ إضافة إحصائية مخصصة جديدة</button>

    <div>
      <label style="margin-bottom:6px">إضافة سريعة لخانات الحديد و COROS الشهيرة:</label>
      <div class="quick-chips" id="quickChips">
        <button type="button" class="chip-btn gym-chip" data-id="sets" data-v="17">🏋️ الجلسات (جلسة/SET)</button>
        <button type="button" class="chip-btn gym-chip" data-id="reps" data-v="164">🏋️ العدات (عدة/REP)</button>
        <button type="button" class="chip-btn gym-chip" data-id="vol" data-v="4850">🏋️ الحجم (كجم/KG)</button>
        <button type="button" class="chip-btn" data-id="cad" data-v="172">+ الكادينس (Cadence)</button>
        <button type="button" class="chip-btn" data-id="pwr" data-v="245">+ الباور (Power)</button>
        <button type="button" class="chip-btn" data-id="maxhr" data-v="184">+ أقصى نبض (Max HR)</button>
        <button type="button" class="chip-btn" data-id="te" data-v="3.6">+ التأثير الهوائي (TE)</button>
      </div>
    </div>
  </section>

  <!-- قسم الخطوط والألوان والأبعاد -->
  <section class="panel">
    <div class="row">
      <label>خط الأرقام والإحصائيات
        <select data-k="numFont" id="numFontSel">
          <option value="'Cairo', 'Chakra Petch', sans-serif">Cairo + Chakra (عربي/رقمي فخم)</option>
          <option value="'Readex Pro', 'Inter', sans-serif">Readex Pro (زجاجي عصري نظيف)</option>
          <option value="'Changa', 'Chakra Petch', sans-serif">Changa (رياضي عربي مربع)</option>
          <option value="'Alexandria', sans-serif">Alexandria (عربي هندسي عريض)</option>
          <option value="'Tajawal', sans-serif">Tajawal (ناعم ومتناسق)</option>
          <option value="'Chakra Petch', monospace">Chakra Petch (رقمي COROS)</option>
          <option value="'Bebas Neue', 'Cairo', sans-serif">Bebas Neue (طولي ضخم)</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono (تقني هندسي)</option>
          <option value="'Oswald', 'Cairo', sans-serif">Oswald (صلب وقوي للحديد)</option>
        </select>
      </label>
      <label>خط العناوين والمسميات
        <select data-k="titleFont" id="titleFontSel">
          <option value="'Cairo', 'Inter', sans-serif">Cairo (القاهرة - عربي احترافي)</option>
          <option value="'Readex Pro', 'Inter', sans-serif">Readex Pro (أسلوب iOS الحديث)</option>
          <option value="'Changa', 'Chakra Petch', sans-serif">Changa (رياضي قوي للحديد)</option>
          <option value="'Alexandria', 'Inter', sans-serif">Alexandria (الإسكندرية - عريض)</option>
          <option value="'IBM Plex Sans Arabic', sans-serif">IBM Plex Arabic (تقني رسمي)</option>
          <option value="'Tajawal', 'Inter', sans-serif">Tajawal (تجوال - كلاسيكي)</option>
          <option value="'Chakra Petch', 'Cairo', sans-serif">Chakra Petch (مضلع حاد)</option>
        </select>
      </label>
    </div>

    <div class="row-3">
      <label>لون الثيم الأساسي<input type="color" data-k="accent" value="#ff5500"></label>
      <label>لون النصوص<input type="color" data-k="txt" value="#ffffff"></label>
      <label>تغميق الخلفية<input type="range" min="0" max="90" value="35" data-k="dark"></label>
    </div>

    <label>إزاحة المحتوى للأسفل (لبعد إضافي عن أفتار ويوزر الستوري)<input type="range" min="0" max="160" value="40" data-k="safeShift"></label>

    <div class="chk-row">
      <label class="chk"><input type="checkbox" data-k="transparent"> خلفية شفافة (ملصق PNG للستوري)</label>
      <label class="chk"><input type="checkbox" data-k="showRoute" checked> إظهار رسمة المسار / أعمدة الجلسات</label>
      <label class="chk"><input type="checkbox" data-k="showBadge" checked> إظهار شعار الجهاز</label>
      <label class="chk"><input type="checkbox" data-k="showSafeGuide"> 👁️ إظهار حدود منطقة الستوري الآمنة (للمعاينة)</label>
    </div>
  </section>

  <button class="go" id="share" type="button">حفظ / مشاركة البطاقة (PNG)</button>
</main>

/* تبديل اللغة بين (اللغتين معاً / العربية / الإنجليزية) */
function applyLanguage(lang) {
  S.lang = lang;
  document.querySelectorAll('.lang-pill').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  const dict = I18N[lang];
  const sp = dict.sports[S.sport] || dict.sports.run;

  S.mainLbl = sp.mainLbl;
  S.mainUnit = sp.mainUnit;
  document.querySelector('[data-k="mainUnit"]').value = sp.mainUnit;

  if (S.sport === 'gym') {
    S.muscleTag = sp.muscleDef;
    document.querySelector('[data-k="muscleTag"]').value = S.muscleTag;
  }

  S.stats.forEach(st => {
    if (st.id === 'pace') {
      st.label = sp.paceLbl;
      st.unit = sp.paceUnit;
    } else if (st.id === 'elev') {
      st.label = sp.elevLbl;
      st.unit = sp.elevUnit;
    } else if (dict.stats[st.id]) {
      st.label = dict.stats[st.id].label;
      st.unit = dict.stats[st.id].unit;
    }
  });

  renderStatsManager();
  sched();
}

document.querySelectorAll('.lang-pill').forEach(btn => {
  btn.onclick = () => applyLanguage(btn.dataset.lang);
});

/* بناء واجهة التحكم بالإحصائيات */
function renderStatsManager() {
  const box = $('statsList');
  box.innerHTML = '';
  S.stats.forEach((st, idx) => {
    const row = document.createElement('div');
    row.className = 'stat-item' + (st.on ? '' : ' off');

    const tog = document.createElement('button');
    tog.type = 'button';
    tog.className = 'stat-toggle';
    tog.textContent = st.on ? '✓' : '';
    tog.onclick = () => {
      st.on = !st.on;
      renderStatsManager();
      sched();
    };

    const fields = document.createElement('div');
    fields.className = 'stat-fields';

    const inLbl = document.createElement('input');
    inLbl.type = 'text';
    inLbl.className = 'rtl-in';
    inLbl.placeholder = 'الاسم';
    inLbl.value = st.label;
    inLbl.oninput = e => { st.label = e.target.value; sched(); };

    const inVal = document.createElement('input');
    inVal.type = 'text';
    inVal.placeholder = 'القيمة';
    inVal.value = st.val;
    inVal.oninput = e => { st.val = e.target.value; sched(); };

    const inUnit = document.createElement('input');
    inUnit.type = 'text';
    inUnit.className = 'rtl-in';
    inUnit.placeholder = 'الوحدة';
    inUnit.value = st.unit;
    inUnit.oninput = e => { st.unit = e.target.value; sched(); };

    fields.append(inLbl, inVal, inUnit);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'stat-del';
    del.textContent = '✕';
    del.onclick = () => {
      S.stats.splice(idx, 1);
      renderStatsManager();
      sched();
    };

    row.append(tog, fields, del);
    box.appendChild(row);
  });
}

    val: '100',
    unit: '',

};

document.querySelectorAll('.chip-btn').forEach(chip => {
  chip.onclick = () => {
    const cid = chip.dataset.id;
    const dict = I18N[S.lang];
    const meta = dict.stats[cid] || { label: cid.toUpperCase(), unit: '' };
    const existing = S.stats.find(x => x.id === cid);
    if (existing) {
      existing.on = true;
      existing.label = meta.label;
      existing.unit = meta.unit;
      if (!existing.val) existing.val = chip.dataset.v;
    } else {
      S.stats.push({
        id: cid,
        label: meta.label,
        val: chip.dataset.v || '',
        unit: meta.unit || '',
        on: true
      });
    }
    renderStatsManager();
    sched();
  };
});

/* تبديل نوع الرياضة وتخصيص الخانات تلقائياً حسب اللغة المختارة */
function applySportMode(sport, keepValues = false) {
  S.sport = sport;
  document.querySelectorAll('.sport-pill').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
  $('gymExtraRow').hidden = sport !== 'gym';

  const dict = I18N[S.lang];
  const sp = dict.sports[sport] || dict.sports.run;
  S.mainLbl = sp.mainLbl;
  S.mainUnit = sp.mainUnit;
  document.querySelector('[data-k="mainUnit"]').value = sp.mainUnit;

  if (sport === 'gym') {
    S.muscleTag = sp.muscleDef;
    document.querySelector('[data-k="muscleTag"]').value = S.muscleTag;
    $('lblMainStat').childNodes[0].nodeValue = 'عدد الجلسات (Sets)';
  } else {
    $('lblMainStat').childNodes[0].nodeValue = sport === 'rope' ? 'إجمالي القفزات' : 'المسافة (كم)';
  }

  const paceIt = S.stats.find(x => x.id === 'pace');
  if (paceIt) { paceIt.label = sp.paceLbl; paceIt.unit = sp.paceUnit; }
  const elevIt = S.stats.find(x => x.id === 'elev');
  if (elevIt) { elevIt.label = sp.elevLbl; elevIt.unit = sp.elevUnit; }

  renderStatsManager();
  sched();
}

document.querySelectorAll('.sport-pill').forEach(btn => {
  btn.onclick = () => applySportMode(btn.dataset.sport, false);

function setStatValue(id, val) {
  if (val === undefined || val === null || val === '') return;
  const dict = I18N[S.lang];
  const sp = dict.sports[S.sport] || dict.sports.run;
  let lbl = dict.stats[id] ? dict.stats[id].label : id.toUpperCase();
  let unt = dict.stats[id] ? dict.stats[id].unit : '';
  if (id === 'pace') { lbl = sp.paceLbl; unt = sp.paceUnit; }
  if (id === 'elev') { lbl = sp.elevLbl; unt = sp.elevUnit; }

  let item = S.stats.find(x => x.id === id);
  if (item) {
    item.label = lbl;
    item.val = String(val);
    item.unit = unt;
    item.on = true;
  } else {
    S.stats.push({ id, label: lbl, val: String(val), unit: unt, on: true });
  }
}

/* دوال الرسم الهندسية والأيقونات */
function rr(c, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

function cover(c, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height), iw = w / s, ih = h / s;
  c.drawImage(img, (img.width - iw) / 2, (img.height - ih) / 2, iw, ih, x, y, w, h);
}

/* =========================================================================
   محرك رسم الزجاج السائل الحقيقي (iOS 26 / visionOS Liquid Glass Engine)
   ========================================================================= */
function prepareBlurredBackdrop() {
  const bc = blurCv.getContext('2d');
  bc.clearRect(0, 0, blurCv.width, blurCv.height);
  bc.save();
  bc.filter = 'blur(18px) saturate(190%)';
  if (S.bg) {
    cover(bc, S.bg, -20, -20, blurCv.width + 40, blurCv.height + 40);
  } else {
    // خلفية كونية زجاجية ناعمة بألوان iOS عند عدم رفع صورة
    const g = bc.createLinearGradient(0, 0, blurCv.width, blurCv.height);
    g.addColorStop(0, '#1e293b');
    g.addColorStop(0.45, '#0f172a');
    g.addColorStop(1, '#090a0f');
    bc.fillStyle = g;
    bc.fillRect(0, 0, blurCv.width, blurCv.height);

    bc.fillStyle = S.accent;
    bc.globalAlpha = 0.35;
    bc.beginPath(); bc.arc(blurCv.width * 0.25, blurCv.height * 0.28, 95, 0, Math.PI * 2); bc.fill();
    bc.fillStyle = '#38bdf8';
    bc.globalAlpha = 0.22;
    bc.beginPath(); bc.arc(blurCv.width * 0.78, blurCv.height * 0.68, 110, 0, Math.PI * 2); bc.fill();
  }
  bc.restore();
}

function drawLiquidGlassBox(c, x, y, w, h, r = 44, tintAlpha = 0.16, highlightAccent = false) {
  c.save();

  // 1) ظل خارجي ناعم يعطي عمق الطفو ثلاثي الأبعاد
  c.save();
  c.shadowColor = 'rgba(0, 0, 0, 0.52)';
  c.shadowBlur = 42;
  c.shadowOffsetY = 18;
  rr(c, x, y, w, h, r);
  c.fillStyle = 'rgba(15, 18, 25, 0.08)';
  c.fill();
  c.restore();

  // 2) قص منطقة الكبسولة ورسم الخلفية المضببة المنكسرة داخلها (Refraction)
  rr(c, x, y, w, h, r);
  c.clip();
  if (!S.transparent) {
    c.drawImage(blurCv, 0, 0, W, H);
  }

  // 3) طبقة الصبغة الزجاجية السائلة المتدرجة (Liquid Sheen)
  const sheen = c.createLinearGradient(x, y, x + w * 0.65, y + h);
  sheen.addColorStop(0, `rgba(255, 255, 255, ${tintAlpha + 0.14})`);
  sheen.addColorStop(0.35, `rgba(255, 255, 255, ${tintAlpha * 0.45})`);
  sheen.addColorStop(0.75, 'rgba(15, 18, 28, 0.32)');
  sheen.addColorStop(1, `rgba(255, 255, 255, ${tintAlpha * 0.65})`);
  c.fillStyle = sheen;
  c.fillRect(x, y, w, h);

  // 4) لمعة العدسة العلوية (Top Specular Caustic Glare)
  const glare = c.createRadialGradient(x + w * 0.3, y - h * 0.1, 10, x + w * 0.5, y, w * 0.85);
  glare.addColorStop(0, 'rgba(255, 255, 255, 0.34)');
  glare.addColorStop(0.5, 'rgba(255, 255, 255, 0.06)');
  glare.addColorStop(1, 'rgba(255, 255, 255, 0)');
  c.fillStyle = glare;
  c.fillRect(x, y, w, h * 0.55);

  // 5) الحد الزجاجي المزدوج المضيء (Specular Rim Border)
  const rimGrad = c.createLinearGradient(x, y, x + w, y + h);
  if (highlightAccent) {
    rimGrad.addColorStop(0, '#ffffff');
    rimGrad.addColorStop(0.35, S.accent);
    rimGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.15)');
    rimGrad.addColorStop(1, S.accent);
  } else {
    rimGrad.addColorStop(0, 'rgba(255, 255, 255, 0.82)');
    rimGrad.addColorStop(0.28, 'rgba(255, 255, 255, 0.22)');
    rimGrad.addColorStop(0.72, 'rgba(255, 255, 255, 0.08)');
    rimGrad.addColorStop(1, 'rgba(255, 255, 255, 0.48)');
  }
  rr(c, x + 1, y + 1, w - 2, h - 2, r - 1);
  c.strokeStyle = rimGrad;
  c.lineWidth = highlightAccent ? 3.2 : 2.4;
  c.stroke();

  c.restore();
}

function txt(c, s, x, y, size, wt, col, al = 'left', fam = S.titleFont, mw = null) {
  if (s === undefined || s === null || s === '') return;
  const str = String(s);
  const isAr = /[\u0600-\u06FF]/.test(str);
  c.save();
  c.direction = isAr ? 'rtl' : 'ltr';
  c.font = `${wt} ${size}px ${fam}`;
  while (mw && c.measureText(str).width > mw && size > 15) {
    size -= 2;
    c.font = `${wt} ${size}px ${fam}`;
  }
  c.fillStyle = col;
  c.textAlign = al;
  c.textBaseline = 'alphabetic';
  c.fillText(str, x, y);
  c.restore();
}

/* رسم أيقونة دامبل / حديد احترافية */
function drawDumbbellVector(c, cx, cy, size, col) {
  c.save();
  c.translate(cx, cy);
  c.strokeStyle = col;
  c.fillStyle = col;
  c.lineCap = 'round';
  c.lineJoin = 'round';

  if (S.sport === 'gym') {
    if (S.gymBadgeStyle === 'plate') {
      c.lineWidth = size * 0.14;
      c.beginPath(); c.arc(0, 0, size * 0.45, 0, Math.PI * 2); c.stroke();
      c.lineWidth = size * 0.06;
      c.beginPath(); c.arc(0, 0, size * 0.18, 0, Math.PI * 2); c.stroke();
    } else if (S.gymBadgeStyle === 'bolt') {
      c.beginPath();
      c.moveTo(size * 0.08, -size * 0.48);
      c.lineTo(-size * 0.32, size * 0.05);
      c.lineTo(size * 0.02, size * 0.05);
      c.lineTo(-size * 0.08, size * 0.48);
      c.lineTo(size * 0.32, -size * 0.05);
      c.lineTo(-size * 0.02, -size * 0.05);
      c.closePath();
      c.fill();
    } else {
      const barW = size * 0.46;
      c.lineWidth = size * 0.12;
      c.beginPath(); c.moveTo(-barW / 2, 0); c.lineTo(barW / 2, 0); c.stroke();
      const pw = size * 0.13, ph1 = size * 0.68, ph2 = size * 0.46;
      rr(c, -barW / 2 - pw * 1.1, -ph1 / 2, pw, ph1, 4); c.fill();
      rr(c, barW / 2 + pw * 0.1, -ph1 / 2, pw, ph1, 4); c.fill();
      rr(c, -barW / 2 - pw * 2.2, -ph2 / 2, pw * 0.9, ph2, 3); c.fill();
      rr(c, barW / 2 + pw * 1.3, -ph2 / 2, pw * 0.9, ph2, 3); c.fill();
    }
  } else if (S.sport === 'bike') {
    c.lineWidth = size * 0.1;
    c.beginPath(); c.arc(-size * 0.28, size * 0.1, size * 0.22, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(size * 0.28, size * 0.1, size * 0.22, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(-size * 0.28, size * 0.1); c.lineTo(0, -size * 0.22); c.lineTo(size * 0.28, size * 0.1); c.stroke();
  } else if (S.sport === 'rope') {
    c.beginPath();
    c.moveTo(size * 0.08, -size * 0.45);
    c.lineTo(-size * 0.28, size * 0.04);
    c.lineTo(size * 0.02, size * 0.04);
    c.lineTo(-size * 0.08, size * 0.45);
    c.lineTo(size * 0.28, -size * 0.04);
    c.lineTo(-size * 0.02, -size * 0.04);
    c.closePath();
    c.fill();
  } else {
    c.lineWidth = size * 0.12;
    c.beginPath();
    c.moveTo(-size * 0.35, size * 0.25);
    c.quadraticCurveTo(-size * 0.1, -size * 0.45, size * 0.1, 0);
    c.quadraticCurveTo(size * 0.25, size * 0.35, size * 0.38, -size * 0.2);
    c.stroke();
  }
  c.restore();
}

/* شارة تمرين اليوم والجهاز */
function drawHeaderBadges(c, x, y, al = 'left', col = S.txt, isLiquid = false) {
  c.save();
  const dict = I18N[S.lang];
  const sp = dict.sports[S.sport] || dict.sports.run;

  const items = [];
  if (S.showBadge && S.tag) {
    items.push({ text: S.tag.toUpperCase(), isCoros: true });
  }
  if (S.showSportIcon) {
    const sportTxt = S.sport === 'gym' ? (S.muscleTag || sp.badge) : sp.badge;
    items.push({ text: sportTxt, isSport: true });
  }

  if (!items.length) { c.restore(); return; }

  c.font = `800 23px ${S.titleFont}`;
  const pillWidths = items.map(it => c.measureText(it.text).width + (it.isSport ? 70 : 50));
  const gap = 14;
  const totalW = pillWidths.reduce((a, b) => a + b, 0) + (items.length - 1) * gap;

  let curX = al === 'center' ? x - totalW / 2 : (al === 'right' ? x - totalW : x);

  items.forEach((it, idx) => {
    const pw = pillWidths[idx];
    const isAr = /[\u0600-\u06FF]/.test(it.text);
    c.direction = isAr ? 'rtl' : 'ltr';

    if (isLiquid) {
      drawLiquidGlassBox(c, curX, y - 36, pw, 50, 25, 0.18, it.isSport);
      if (it.isSport) {
        drawDumbbellVector(c, curX + 28, y - 11, 28, S.accent);
        c.fillStyle = '#fff';
        c.font = `800 23px ${S.titleFont}`;
        c.textAlign = 'center';
        c.fillText(it.text, curX + 24 + (pw - 24) / 2, y - 2);
      } else {
        c.fillStyle = S.accent;
        c.beginPath(); c.arc(curX + 22, y - 11, 7, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#fff';
        c.font = `800 23px ${S.numFont}`;
        c.textAlign = 'center';
        c.fillText(it.text, curX + 18 + (pw - 18) / 2, y - 2);
      }
    } else {
      rr(c, curX, y - 34, pw, 48, 14);
      if (it.isSport && S.sport === 'gym') {
        c.fillStyle = S.accent;
        c.fill();
        drawDumbbellVector(c, curX + 28, y - 10, 30, '#000');
        c.fillStyle = '#000';
        c.font = `800 23px ${S.titleFont}`;
        c.textAlign = 'center';
        c.fillText(it.text, curX + 24 + (pw - 24) / 2, y - 1);
      } else if (it.isSport) {
        c.fillStyle = 'rgba(255, 85, 0, 0.18)';
        c.fill();
        c.strokeStyle = S.accent;
        c.lineWidth = 2;
        c.stroke();
        drawDumbbellVector(c, curX + 26, y - 10, 26, S.accent);
        c.fillStyle = col;
        c.font = `800 23px ${S.titleFont}`;
        c.textAlign = 'center';
        c.fillText(it.text, curX + 22 + (pw - 22) / 2, y - 1);
      } else {
        c.fillStyle = 'rgba(255, 255, 255, 0.09)';
        c.fill();
        c.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        c.lineWidth = 1.5;
        c.stroke();
        c.fillStyle = S.accent;
        c.beginPath(); c.arc(curX + 20, y - 10, 7, 0, Math.PI * 2); c.fill();
        c.fillStyle = col;
        c.font = `800 23px ${S.numFont}`;
        c.textAlign = 'center';
        c.fillText(it.text, curX + 16 + (pw - 16) / 2, y - 1);
      }
    }
    curX += pw + gap;
  });

  c.restore();
}

/* رسم مسار الـ GPS أو أعمدة الجلسات لتمارين الحديد */
function drawVisualCenterpiece(c, boxX, boxY, boxW, boxH, color, lineWidth = 10) {
  if (!S.showRoute) return;
  c.save();

  if (S.sport === 'gym') {
    c.save();
    c.globalAlpha = 0.12;
    drawDumbbellVector(c, boxX + boxW / 2, boxY + boxH * 0.42, Math.min(boxW, boxH) * 0.72, color);
    c.restore();

    const parsedSets = parseInt(S.dist);
    const setsCount = Math.min(30, Math.max(4, parsedSets || S.setReps.length || 12));
    const bars = (S.setReps.length > 0 && (!parsedSets || S.setReps.length === parsedSets))
      ? S.setReps.slice(0, 30)
      : Array.from({ length: setsCount }, (_, i) => S.setReps[i] || (8 + Math.round(Math.sin(i * 0.9 + 1) * 3 + (i % 3))));

    const maxRep = Math.max(...bars, 12);
    const chartW = boxW * 0.86;
    const chartH = boxH * 0.52;
    const startX = boxX + (boxW - chartW) / 2;
    const baseY = boxY + boxH * 0.78;
    const gap = Math.max(5, Math.round(chartW / (bars.length * 3.5)));
    const barW = (chartW - gap * (bars.length - 1)) / bars.length;

    const chartLbl = I18N[S.lang].setsChartTitle(parsedSets || bars.length);
    txt(c, chartLbl, boxX + boxW / 2, baseY - chartH - 26, 22, 700, 'rgba(255,255,255,0.68)', 'center', S.titleFont, boxW - 30);

    bars.forEach((rep, idx) => {
      const bh = Math.max(24, (rep / maxRep) * chartH);
      const bx = startX + idx * (barW + gap);
      const by = baseY - bh;

      rr(c, bx, baseY - chartH, barW, chartH, Math.min(10, barW / 2));
      c.fillStyle = 'rgba(255,255,255,0.08)';
      c.fill();

      rr(c, bx, by, barW, bh, Math.min(10, barW / 2));
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 18;
      c.fill();
      c.shadowBlur = 0;
    });

    c.restore();
    return;
  }

  let pts = S.route;
  if (!pts || pts.length < 3) {
    if (S.sport === 'rope') {
      const midY = boxY + boxH / 2;
      const wave = [0, 0, 0.08, -0.05, 0.12, -0.45, 0.65, -0.25, 0, 0.15, 0.22, 0, 0, 0];
      c.beginPath();
      wave.forEach((v, i) => {
        const px = boxX + (i / (wave.length - 1)) * boxW;
        const py = midY + v * (boxH * 0.65);
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      });
      c.strokeStyle = color;
      c.lineWidth = lineWidth;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.shadowColor = color;
      c.shadowBlur = 28;
      c.stroke();
      c.restore();
      return;
    }
    pts = [
      [0.15, 0.75], [0.10, 0.48], [0.22, 0.25], [0.48, 0.14],
      [0.76, 0.20], [0.90, 0.45], [0.82, 0.72], [0.58, 0.86],
      [0.32, 0.84], [0.15, 0.75]
    ];
  }

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(([lat, lon]) => {
    if (lon < minX) minX = lon;
    if (lon > maxX) maxX = lon;
    if (lat < minY) minY = lat;
    if (lat > maxY) maxY = lat;
  });

  const spanX = (maxX - minX) || 1;
  const spanY = (maxY - minY) || 1;
  const scale = Math.min(boxW / spanX, boxH / spanY) * 0.84;
  const offX = boxX + (boxW - spanX * scale) / 2;
  const offY = boxY + (boxH - spanY * scale) / 2;

  const mapped = pts.map(([lat, lon]) => [
    offX + (lon - minX) * scale,
    offY + (maxY - lat) * scale
  ]);

  c.beginPath();
  mapped.forEach(([px, py], idx) => {
    if (idx === 0) c.moveTo(px, py);
    else c.lineTo(px, py);
  });

  c.strokeStyle = color;
  c.lineWidth = lineWidth;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.shadowColor = color;
  c.shadowBlur = 32;
  c.stroke();

  const start = mapped[0], end = mapped[mapped.length - 1];
  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(start[0], start[1], lineWidth * 0.9, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.arc(end[0], end[1], lineWidth * 1.1, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 4; c.stroke();

  c.restore();
}

function drawStatCell(c, x, y, label, val, unit, al = 'left', valSize = 64, maxW = 280, inkCol = S.txt) {
  const displayVal = (val !== undefined && val !== '') ? val : '--';
  txt(c, label, x, y, 22, 700, inkCol === S.txt ? 'rgba(255,255,255,0.68)' : 'rgba(0,0,0,0.62)', al, S.titleFont, maxW);
  c.save();
  let sz = valSize;
  c.font = `700 ${sz}px ${S.numFont}`;
  while (c.measureText(String(displayVal)).width > maxW * 0.72 && sz > 26) {
    sz -= 3;
    c.font = `700 ${sz}px ${S.numFont}`;
  }
  const vw = c.measureText(String(displayVal)).width;
  const uSz = Math.max(17, Math.round(sz * 0.32));
  c.font = `700 ${uSz}px ${S.titleFont}`;
  const uw = unit ? Math.min(maxW * 0.4, c.measureText(unit).width) + 8 : 0;

  let vx = x;
  if (al === 'center') vx = x - uw / 2;
  else if (al === 'right') vx = x - uw;

  txt(c, displayVal, vx, y + sz + 8, sz, 700, inkCol, al, S.numFont);
  if (unit) {
    const ux = al === 'center' ? vx + vw / 2 + 8 : (al === 'right' ? x : vx + vw + 8);
    txt(c, unit, ux, y + sz + 8, uSz, 700, S.accent, al === 'right' ? 'right' : 'left', S.titleFont, maxW * 0.42);
  }
  c.restore();
}

function drawDynamicStatsGrid(c, items, boxX, boxY, boxW, boxH, maxCols = 3, align = 'left', inkCol = S.txt) {
  if (!items.length) return;
  const n = items.length;
  const cols = Math.min(maxCols, n === 1 ? 1 : (n === 2 || n === 4 ? 2 : maxCols));
  const rows = Math.ceil(n / cols);
  const cellW = boxW / cols;
  const cellH = Math.min(185, boxH / rows);
  const valSize = rows >= 4 ? 48 : (cols === 3 ? 60 : 68);

  items.forEach((st, i) => {
    const r = Math.floor(i / cols);
    const colIdx = i % cols;
    const itemsInRow = (r === rows - 1) ? (n - r * cols) : cols;
    const rowWidth = itemsInRow * cellW;
    const rowStartX = align === 'center' ? boxX + (boxW - rowWidth) / 2 : boxX;

    const cx = align === 'center'
      ? rowStartX + colIdx * cellW + cellW / 2
      : rowStartX + colIdx * cellW;
    const cy = boxY + r * cellH;

    drawStatCell(c, cx, cy, st.label, st.val, st.unit, align, valSize, cellW - 18, inkCol);
  });
}

function getCardState() {
  const dict = I18N[S.lang];
  const cfg = dict.sports[S.sport] || dict.sports.run;
  let dStr = '';
  if (S.date) {
    const dObj = new Date(S.date + 'T12:00:00');
    if (S.lang === 'ar') {
      dStr = dObj.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long', year: 'numeric' });
    } else if (S.lang === 'bi') {
      const arM = dObj.toLocaleDateString('ar-SA', { day: 'numeric', month: 'short' });
      const enM = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
      dStr = `${arM} · ${enM}`;
    } else {
      dStr = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
    }
  }
  const activeStats = S.stats.filter(x => x.on);
  return {
    cfg,
    title: S.title || cfg.defTitle,
    dateStr: dStr,
    dist: S.dist || (S.sport === 'gym' ? '17' : '0.00'),
    mainLbl: S.mainLbl || cfg.mainLbl,
    mainUnit: S.mainUnit || cfg.mainUnit,
    activeStats
  };
}

function drawStorySafeOverlay(c) {

  c.fillRect(0, 0, W, 250 + S.safeShift);

  c.strokeStyle = 'rgba(255, 90, 90, 0.75)';

  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(0, 250 + S.safeShift); c.lineTo(W, 250 + S.safeShift);
  c.moveTo(0, 1700); c.lineTo(W, 1700);
  c.stroke();

  c.fillStyle = 'rgba(255,255,255,0.25)';

  txt(c, 'منطقة الردود السفلية للستوري (محمية)', 540, 1810, 28, 700, '#ff8080', 'center', S.titleFont);

}

/* الدالة الرئيسية لرسم الـ 14 ثيم (بما فيها iOS Liquid Glass) */
function drawCard(c, w, st, isExport = false) {
  const u = w / W;
  c.setTransform(u, 0, 0, u, 0, 0);
  c.clearRect(0, 0, W, H);
  const M = getCardState();

  const TOP = 265 + (+S.safeShift || 0);
  const BOT = 1685;

  // تجهيز الخلفية المضببة لانكسار الزجاج السائل
  if (st === 0 || st === 1) {
    prepareBlurredBackdrop();
  }

  if (!S.transparent) {
    if (S.bg) {
      cover(c, S.bg, 0, 0, W, H);
    } else if (st === 0 || st === 1) {
      // خلفية iOS مع كرات ضوئية خلف الزجاج السائل
      const g = c.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#0f172a');
      g.addColorStop(0.5, '#090b10');
      g.addColorStop(1, '#030305');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);

      c.save();
      const orb1 = c.createRadialGradient(280, TOP + 280, 20, 280, TOP + 280, 420);
      orb1.addColorStop(0, S.accent);
      orb1.addColorStop(1, 'transparent');
      c.globalAlpha = 0.28;
      c.fillStyle = orb1;
      c.fillRect(0, 0, W, H);

      const orb2 = c.createRadialGradient(820, TOP + 920, 20, 820, TOP + 920, 460);
      orb2.addColorStop(0, '#38bdf8');
      orb2.addColorStop(1, 'transparent');
      c.globalAlpha = 0.18;
      c.fillStyle = orb2;
      c.fillRect(0, 0, W, H);
      c.restore();
    } else if (st === 9) {
      const g = c.createRadialGradient(W * 0.5, H * 0.42, 40, W * 0.5, H * 0.5, H * 0.85);
      g.addColorStop(0, S.accent);
      g.addColorStop(0.45, '#1a0905');
      g.addColorStop(1, '#040406');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    } else {
      const g = c.createRadialGradient(W * 0.5, H * 0.3, 50, W * 0.5, H * 0.5, H * 0.9);
      g.addColorStop(0, '#1c1e26');
      g.addColorStop(0.6, '#0c0d12');
      g.addColorStop(1, '#040406');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    }
    c.fillStyle = `rgba(0, 0, 0, ${S.dark / 100})`;
    c.fillRect(0, 0, W, H);
  }

  // =========================================================================
  // ثيم 0: iOS Liquid Glass 💧 (لوح زجاجي سائل عائم مع كبسولات زجاجية داخلية)
  // =========================================================================
  if (st === 0) {
    drawHeaderBadges(c, 540, TOP, 'center', S.txt, true);

    // البطاقة الزجاجية السائلة الكبرى
    const cardTop = TOP + 35;
    const cardH = BOT - cardTop;
    drawLiquidGlassBox(c, 60, cardTop, 960, cardH, 56, 0.16, false);

    // العنوان والتاريخ داخل الزجاج السائل
    txt(c, M.title, 540, cardTop + 72, 48, 800, S.txt, 'center', S.titleFont, 860);
    if (M.dateStr) txt(c, M.dateStr, 540, cardTop + 112, 23, 700, 'rgba(255,255,255,0.68)', 'center', S.titleFont);

    let curY = cardTop + 140;

    // كبسولة الرقم الرئيسي الزجاجية السائلة
    if (S.showMain) {
      drawLiquidGlassBox(c, 100, curY, 880, 235, 42, 0.22, true);
      txt(c, M.mainLbl, 540, curY + 52, 25, 700, 'rgba(255,255,255,0.78)', 'center', S.titleFont, 800);
      txt(c, M.dist, 540, curY + 172, 132, 800, S.txt, 'center', S.numFont, 780);
      txt(c, M.mainUnit, 540, curY + 215, 28, 800, S.accent, 'center', S.titleFont, 500);
      curY += 255;
    }

    // رسم المسار أو أعمدة الجلسات
    if (S.showRoute) {
      const rH = S.showMain ? 330 : 480;
      drawVisualCenterpiece(c, 120, curY + 10, 840, rH, S.accent, 12);
      curY += rH + 25;
    }

    // شبكة الإحصائيات داخل الزجاج السائل
    const availH = (cardTop + cardH - 30) - curY;
    drawDynamicStatsGrid(c, M.activeStats, 100, curY + 10, 880, availH, 3, 'center');
  }

  // =========================================================================
  // ثيم 1: كبسولات Liquid Glass 💧 (كل إحصائية في كبسولة زجاجية سائلة مستقلة)
  // =========================================================================
  if (st === 1) {
    drawHeaderBadges(c, 540, TOP, 'center', S.txt, true);

    // كبسولة العنوان الزجاجية
    drawLiquidGlassBox(c, 75, TOP + 30, 930, 115, 38, 0.18, false);
    txt(c, M.title, 540, TOP + 85, 42, 800, S.txt, 'center', S.titleFont, 850);
    if (M.dateStr) txt(c, M.dateStr, 540, TOP + 124, 21, 700, 'rgba(255,255,255,0.68)', 'center', S.titleFont);

    let nextY = TOP + 165;
    if (S.showRoute) {
      drawLiquidGlassBox(c, 75, nextY, 930, 340, 44, 0.14, false);
      drawVisualCenterpiece(c, 115, nextY + 20, 850, 300, S.accent, 11);
      nextY += 360;
    }

    const cards = S.showMain
      ? [{ label: M.mainLbl, val: M.dist, unit: M.mainUnit, highlight: true }, ...M.activeStats]
      : [...M.activeStats];

    const n = cards.length;
    const cols = n === 1 ? 1 : 2;
    const rows = Math.ceil(n / cols);
    const gap = 16;
    const availH = BOT - nextY;
    const cardW = cols === 1 ? 820 : (930 - gap) / 2;
    const cardH = Math.min(205, (availH - (rows - 1) * gap) / Math.max(1, rows));
    const startX = cols === 1 ? (W - cardW) / 2 : 75;

    cards.forEach((it, idx) => {
      const col = idx % cols, row = Math.floor(idx / cols);
      const bx = startX + col * (cardW + gap);
      const by = nextY + row * (cardH + gap);

      drawLiquidGlassBox(c, bx, by, cardW, cardH, 36, it.highlight ? 0.24 : 0.16, !!it.highlight);
      const vSz = cardH < 165 ? 48 : 62;
      drawStatCell(c, bx + cardW / 2, by + Math.round(cardH * 0.28), it.label, it.val, it.unit, 'center', vSz, cardW - 40);
    });
  }

  // ثيم 2: بطاقة الحديد والقوة (Iron Club Card)
  if (st === 2) {
    c.save();
    rr(c, 65, TOP - 25, 950, BOT - TOP + 20, 44);
    c.fillStyle = 'rgba(14, 15, 19, 0.86)';
    c.fill();
    c.strokeStyle = S.accent;
    c.lineWidth = 3;
    c.stroke();
    c.restore();

    c.save();
    rr(c, 95, TOP + 5, 890, 95, 24);
    c.fillStyle = 'rgba(255, 85, 0, 0.12)';
    c.fill();
    c.restore();

    drawDumbbellVector(c, 155, TOP + 52, 54, S.accent);
    txt(c, M.title, 215, TOP + 48, 36, 800, S.txt, 'left', S.titleFont, 490);
    txt(c, (S.muscleTag || S.tag || 'WORKOUT'), 215, TOP + 84, 22, 700, S.accent, 'left', S.titleFont, 490);
    if (M.dateStr) txt(c, M.dateStr, 950, TOP + 62, 21, 700, 'rgba(255,255,255,0.65)', 'right', S.titleFont);

    if (S.showMain) {
      c.save();
      rr(c, 95, TOP + 130, 890, 250, 28);

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDuration(sec) {
  if (!sec || sec <= 0) return '';
  const hrs = Math.floor(sec / 3600);
  const mins = Math.floor((sec % 3600) / 60);
  const s = Math.round(sec % 60);
  if (hrs > 0) return `${hrs}:${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${mins}:${String(s).padStart(2, '0')}`;
}

function formatPace(secPerKm) {
  if (!secPerKm || !isFinite(secPerKm) || secPerKm <= 0) return '';
  const m = Math.floor(secPerKm / 60);
  const s = Math.round(secPerKm % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function syncInputsFromState() {

  });
  renderStatsManager();
  sched();
}

/* =========================================================================
   قارئ ملفات .FIT الدقيق (يستبعد وقت الـ Pause + يستبعد جلسات الراحة)
   ========================================================================= */
function parseFitBuffer(buf) {
  const view = new DataView(buf);
  if (view.byteLength < 14) return null;
  const hdrSize = view.getUint8(0);
  const dataLen = view.getUint32(4, true);
  let pos = hdrSize;
  const end = Math.min(view.byteLength, hdrSize + dataLen);
  const defs = {};
  const pts = [];
  let hrSum = 0, hrCnt = 0, cadSum = 0, cadCnt = 0, pwrSum = 0, pwrCnt = 0;
  let minTs = null, maxTs = null, prevRecTs = null, movingRecSec = 0;
  let lastAlt = null, elevGain = 0, maxDist = 0;

  let fitSport = null, fitSubSport = null;
  let sessionTimerSec = 0; // total_timer_time (وقت التمرين الفعلي بدون Pause)
  let sessionDistKm = 0;
  let sessionCalories = 0;
  let sessionAvgHr = 0;
  let sessionAscent = 0;

  let activeSetsCount = 0;
  let totalRepsCount = 0;
  let totalVolumeKg = 0;
  const setRepsList = [];
  let activeLapsCount = 0;

  while (pos < end) {
    const hdr = view.getUint8(pos++);
    if (hdr & 0x80) continue;
    const isDef = (hdr & 0x40) !== 0;
    const hasDev = (hdr & 0x20) !== 0;
    const localNum = hdr & 0x0f;

    if (isDef) {
      pos++;
      const arch = view.getUint8(pos++);
      const le = arch === 0;
      const gMsg = view.getUint16(pos, le); pos += 2;
      const nFields = view.getUint8(pos++);
      const fields = [];
      for (let i = 0; i < nFields; i++) {
        fields.push({ num: view.getUint8(pos), size: view.getUint8(pos + 1), type: view.getUint8(pos + 2) });
        pos += 3;
      }
      if (hasDev) {
        const nDev = view.getUint8(pos++);
        for (let i = 0; i < nDev; i++) {
          fields.push({ num: -1, size: view.getUint8(pos + 1), type: 0 });
          pos += 3;
        }
      }
      defs[localNum] = { gMsg, le, fields };
    } else {
      const def = defs[localNum];
      if (!def) break;
      let lat = null, lon = null;
      let setType = null, setReps = null, setWeight = 0;
      let lapIntensity = null;

      for (const f of def.fields) {
        if (pos + f.size > end) { pos = end; break; }

        if (def.gMsg === 18) {
          if (f.num === 5 && f.size === 1) fitSport = view.getUint8(pos);
          else if (f.num === 6 && f.size === 1) fitSubSport = view.getUint8(pos);
          else if (f.num === 8 && f.size === 4) {
            const t = view.getUint32(pos, def.le);
            if (t !== 0xFFFFFFFF && t > 0) sessionTimerSec = t / 1000;
          } else if (f.num === 9 && f.size === 4) {
            const d = view.getUint32(pos, def.le);
            if (d !== 0xFFFFFFFF && d > 0) sessionDistKm = d / 100000;
          } else if (f.num === 11 && f.size === 2) {
            const c = view.getUint16(pos, def.le);
            if (c !== 0xFFFF) sessionCalories = c;
          } else if (f.num === 16 && f.size === 1) {
            const h = view.getUint8(pos);
            if (h !== 0xFF && h > 30) sessionAvgHr = h;
          } else if (f.num === 22 && f.size === 2) {
            const asc = view.getUint16(pos, def.le);
            if (asc !== 0xFFFF) sessionAscent = asc;
          }
        }
        else if (def.gMsg === 225) {
          if (f.num === 0 && f.size === 1) {
            const st = view.getUint8(pos);
            if (st !== 0xFF) setType = st; // 1 = Active, 0 = Rest
          } else if (f.num === 3 && f.size === 2) {
            const r = view.getUint16(pos, def.le);
            if (r !== 0xFFFF) setReps = r;
          } else if (f.num === 4 && f.size === 2) {
            const w = view.getUint16(pos, def.le);
            if (w !== 0xFFFF) setWeight = w / 16;
          }
        }
        else if (def.gMsg === 19) {
          if (f.num === 23 && f.size === 1) {
            const inten = view.getUint8(pos);
            if (inten !== 0xFF) lapIntensity = inten;
          }
        }
        else if (def.gMsg === 20) {
          if (f.num === 253 && f.size === 4) {
            const ts = view.getUint32(pos, def.le);
            if (ts !== 0xFFFFFFFF) {
              if (!minTs) minTs = ts;
              maxTs = ts;
              if (prevRecTs !== null) {
                const delta = ts - prevRecTs;
                if (delta > 0 && delta <= 15) movingRecSec += delta;
              }
              prevRecTs = ts;
            }
          } else if (f.num === 0 && f.size === 4) {
            const v = view.getInt32(pos, def.le);
            if (v !== 0x7FFFFFFF) lat = v * (180 / 2147483648);
          } else if (f.num === 1 && f.size === 4) {
            const v = view.getInt32(pos, def.le);
            if (v !== 0x7FFFFFFF) lon = v * (180 / 2147483648);
          } else if (f.num === 2 && f.size === 2) {
            const v = view.getUint16(pos, def.le);
            if (v !== 0xFFFF) {
              const alt = v / 5 - 500;
              if (lastAlt !== null && alt > lastAlt) elevGain += (alt - lastAlt);
              lastAlt = alt;
            }
          } else if (f.num === 3 && f.size === 1) {
            const v = view.getUint8(pos);
            if (v !== 0xFF && v > 30) { hrSum += v; hrCnt++; }
          } else if (f.num === 4 && f.size === 1) {
            const v = view.getUint8(pos);
            if (v !== 0xFF && v > 0) { cadSum += v; cadCnt++; }
          } else if (f.num === 5 && f.size === 4) {
            const v = view.getUint32(pos, def.le);
            if (v !== 0xFFFFFFFF) maxDist = Math.max(maxDist, v / 100);
          } else if (f.num === 7 && f.size === 2) {
            const v = view.getUint16(pos, def.le);
            if (v !== 0xFFFF && v > 0) { pwrSum += v; pwrCnt++; }
          }
        }
        pos += f.size;
      }

      if (def.gMsg === 225) {
        const isActiveSet = (setType === 1) || (setType === null && setReps !== null && setReps > 0);
        if (isActiveSet) {
          activeSetsCount++;
          const repsVal = setReps || 0;
          totalRepsCount += repsVal;
          if (repsVal > 0) setRepsList.push(repsVal);
          if (setWeight > 0 && repsVal > 0) totalVolumeKg += (setWeight * repsVal);
        }
      }

      if (def.gMsg === 19 && lapIntensity === 0) {
        activeLapsCount++;
      }

      if (lat !== null && lon !== null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
        pts.push([lat, lon]);
      }
    }
  }

  const finalSets = activeSetsCount > 0 ? activeSetsCount : activeLapsCount;
  const isStrength = (fitSport === 10 || fitSubSport === 20 || activeSetsCount > 0);
  const finalDurationSec = sessionTimerSec > 0 ? sessionTimerSec : (movingRecSec > 0 ? movingRecSec : ((minTs && maxTs) ? (maxTs - minTs) : 0));
  const finalDistKm = sessionDistKm > 0 ? sessionDistKm : (maxDist > 0 ? maxDist / 1000 : 0);

  return {
    isStrength,
    fitSport,
    activeSets: finalSets,
    totalReps: totalRepsCount,
    totalVolumeKg: Math.round(totalVolumeKg),
    setRepsList,
    sessionCalories,
    pts,
    distKm: finalDistKm,
    durationSec: Math.round(finalDurationSec),
    startEpochMs: minTs ? (minTs + 631065600) * 1000 : null,
    avgHr: sessionAvgHr > 0 ? sessionAvgHr : (hrCnt ? Math.round(hrSum / hrCnt) : 0),
    avgCad: cadCnt ? Math.round(cadSum / cadCnt) : 0,
    avgPwr: pwrCnt ? Math.round(pwrSum / pwrCnt) : 0,
    elevGain: sessionAscent > 0 ? sessionAscent : Math.round(elevGain)
  };
}

/* رفع وقراءة ملفات التمرين (.FIT / .GPX / .TCX) */
$('trackFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  msg.textContent = 'جاري تحليل ملف التمرين واستخراج الجلسات الفعالة ووقت التمرين الصافي...';

  try {
    if (f.name.toLowerCase().endsWith('.fit')) {
      const buf = await f.arrayBuffer();
      const res = parseFitBuffer(buf);
      if (res) {
        if (res.isStrength) {
          applySportMode('gym', true);
          S.dist = String(res.activeSets || 17);
          S.setReps = res.setRepsList;
          if (res.totalReps > 0) setStatValue('pace', res.totalReps);
          if (res.totalVolumeKg > 0) setStatValue('elev', res.totalVolumeKg);
        } else {
          if (res.fitSport === 2) applySportMode('bike', true);
          else applySportMode('run', true);

          if (res.pts.length > 1) {
            const step = Math.max(1, Math.floor(res.pts.length / 250));
            S.route = res.pts.filter((_, idx) => idx % step === 0);
          }
          if (res.distKm > 0) S.dist = res.distKm.toFixed(2);
          if (res.elevGain > 0) setStatValue('elev', res.elevGain);
        }

        if (res.durationSec > 0) {
          setStatValue('time', formatDuration(res.durationSec));
          if (!res.isStrength && res.distKm > 0) {
            const pVal = S.sport === 'bike'
              ? (res.distKm / (res.durationSec / 3600)).toFixed(1)
              : formatPace(res.durationSec / res.distKm);
            setStatValue('pace', pVal);
          }
        }
        if (res.avgHr > 0) setStatValue('hr', res.avgHr);
        if (res.sessionCalories > 0) setStatValue('cal', res.sessionCalories);
        if (res.avgCad > 0 && !res.isStrength) setStatValue('cad', res.avgCad);
        if (res.avgPwr > 0) setStatValue('pwr', res.avgPwr);
        if (res.startEpochMs) S.date = new Date(res.startEpochMs).toISOString().slice(0, 10);

        e.target.parentNode.childNodes[0].nodeValue = '✓ تم استخراج بيانات FIT بدقة';
        msg.textContent = res.isStrength
          ? `تم استخراج التمرين الصافي بدون التوقف: (${res.activeSets} جلسة فعلية / الزمن ${formatDuration(res.durationSec)})!`
          : `تم استخراج المسار والزمن الصافي (${formatDuration(res.durationSec)}) بنجاح!`;
        syncInputsFromState();
        return;
      }
    }

    const text = await f.text();
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    let trkpts = [...doc.querySelectorAll('trkpt')];
    const pts = [];
    let elevGain = 0, lastEle = null;
    let hrSum = 0, hrCount = 0;
    let firstTime = null, prevTime = null, movingSec = 0;

    if (trkpts.length) {
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        if (!isNaN(lat) && !isNaN(lon)) pts.push([lat, lon]);
        const eleEl = pt.querySelector('ele');
        if (eleEl) {
          const ele = parseFloat(eleEl.textContent);
          if (!isNaN(ele)) {
            if (lastEle !== null && ele > lastEle) elevGain += (ele - lastEle);
            lastEle = ele;
          }
        }
        const tEl = pt.querySelector('time');
        if (tEl) {
          const ts = Date.parse(tEl.textContent);
          if (!isNaN(ts)) {
            if (!firstTime) firstTime = ts;
            if (prevTime !== null) {
              const dt = (ts - prevTime) / 1000;
              if (dt > 0 && dt <= 15) movingSec += dt;
            }
            prevTime = ts;
          }
        }
        const hrEl = pt.getElementsByTagName('gpxtpx:hr')[0] || pt.getElementsByTagName('ns3:hr')[0] || pt.querySelector('hr');
        if (hrEl) {
          const h = parseFloat(hrEl.textContent);
          if (!isNaN(h)) { hrSum += h; hrCount++; }
        }
      });
    }

    if (pts.length > 1) {
      const step = Math.max(1, Math.floor(pts.length / 250));
      S.route = pts.filter((_, idx) => idx % step === 0);

      let totalKm = 0;
      for (let i = 1; i < pts.length; i++) {
        totalKm += haversineKm(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
      }
      if (totalKm > 0) S.dist = totalKm.toFixed(2);

      if (movingSec > 0) {
        setStatValue('time', formatDuration(movingSec));
        if (totalKm > 0) {
          const pVal = S.sport === 'bike'
            ? (totalKm / (movingSec / 3600)).toFixed(1)
            : formatPace(movingSec / totalKm);
          setStatValue('pace', pVal);
        }
        if (firstTime) S.date = new Date(firstTime).toISOString().slice(0, 10);
      }
      if (elevGain > 0) setStatValue('elev', Math.round(elevGain));
      if (hrCount > 0) setStatValue('hr', Math.round(hrSum / hrCount));

      const nameEl = doc.querySelector('trk > name, Name');
      if (nameEl && nameEl.textContent.trim()) S.title = nameEl.textContent.trim();

      e.target.parentNode.childNodes[0].nodeValue = '✓ تم رسم المسار والأرقام';
      msg.textContent = 'تم استخراج المسار والإحصائيات بنجاح!';
      syncInputsFromState();
    } else {
      msg.textContent = 'لم يتم العثور على إحداثيات داخل الملف.';
    }
  } catch (err) {
    msg.textContent = 'تعذر قراءة الملف، تأكد أنه بصيغة FIT أو GPX أو TCX.';
  }
};

/* استخراج الأرقام من رابط أو نص مشاركة COROS */
function parseCorosTextOrHtml(raw) {
  if (!raw) return false;
  let found = false;

  const setsMatch = raw.match(/(\d{1,3})\s*(?:sets|set|جلسات|جلسة|جولات)/i);
  const repsMatch = raw.match(/(\d{1,4})\s*(?:reps|rep|عدات|عدة|تكرار)/i);
  const isStrengthText = /strength|gym|weight|muscle|حديد|مقاومة|قوة/i.test(raw) || (setsMatch && repsMatch);

  if (isStrengthText) {
    applySportMode('gym', true);
    if (setsMatch) { S.dist = setsMatch[1]; found = true; }
    if (repsMatch) { setStatValue('pace', repsMatch[1]); found = true; }
    const volMatch = raw.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|كجم|كغ)/i);
    if (volMatch) { setStatValue('elev', volMatch[1].replace(',', '')); found = true; }
  } else {
    const distMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:km|كم|kilometers)/i);
    if (distMatch) { S.dist = distMatch[1]; found = true; }

    const paceMatch = raw.match(/(\d{1,2})['’:](\d{2})(?:"|”)?\s*(?:\/km|\/كم|min\/km)?/i);
    if (paceMatch) { setStatValue('pace', `${paceMatch[1]}:${paceMatch[2]}`); found = true; }
  }

  const curPace = (S.stats.find(x => x.id === 'pace') || {}).val;
  const timeMatches = [...raw.matchAll(/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/g)].map(m => m[1]);
  const durCandidate = timeMatches.find(t => t !== curPace && t.length >= 4);
  if (durCandidate) { setStatValue('time', durCandidate.replace(/^00:/, '')); found = true; }

  const hrMatch = raw.match(/(\d{2,3})\s*(?:bpm|نبضة)/i);
  if (hrMatch) { setStatValue('hr', hrMatch[1]); found = true; }

  if (!isStrengthText) {
    const elevMatch = raw.match(/(?:elev(?:ation)?|ascent|الارتفاع)[^\d]{0,15}(\d{1,4})\s*(?:m|م)?/i);
    if (elevMatch) { setStatValue('elev', elevMatch[1]); found = true; }
  }

  const calMatch = raw.match(/(\d{2,4})\s*(?:kcal|cal|سعرة)/i);
  if (calMatch) { setStatValue('cal', calMatch[1]); found = true; }

  const tlMatch = raw.match(/(?:load|tl|حمل التدريب)[^\d]{0,10}(\d{1,3})/i);
  if (tlMatch) { setStatValue('tl', tlMatch[1]); found = true; }

  if (found) syncInputsFromState();
  return found;
}

$('fetchBtn').onclick = async () => {
  const val = $('corosUrl').value.trim();
  if (!val) { msg.textContent = 'الصق رابط التمرين أو نص التمرين أولاً.'; return; }

  if (!/^https?:\/\//i.test(val) && parseCorosTextOrHtml(val)) {
    msg.textContent = 'تم تعبئة إحصائيات التمرين تلقائياً!';
    return;
  }

  const urlMatch = val.match(/https?:\/\/[^\s]+/i);
  const targetUrl = urlMatch ? urlMatch[0] : val;

  msg.textContent = 'جاري جلب بيانات التمرين من رابط COROS...';
  $('fetchBtn').disabled = true;

  const endpoints = [
    `https://r.jina.ai/${targetUrl}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
  ];

  let fetchedText = '';
  for (const ep of endpoints) {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 7500);
      const r = await fetch(ep, { signal: ctl.signal });
      clearTimeout(to);
      if (r.ok) {
        const t = await r.text();
        if (t && t.length > 40) {
          fetchedText += '\n' + t;
          if (parseCorosTextOrHtml(fetchedText)) break;
        }
      }
    } catch (e) {}
  }

  $('fetchBtn').disabled = false;

  if (parseCorosTextOrHtml(fetchedText) || parseCorosTextOrHtml(val)) {
    msg.textContent = 'تم جلب إحصائيات التمرين وتعبئتها!';
  } else {
    msg.textContent = 'رابط COROS محمي؛ ارفع ملف (.FIT أو .GPX) من تطبيق COROS أو عدل الخانات بالأسفل.';
  }
};
