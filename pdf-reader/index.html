<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05060a" />
<title>قارئ PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="a1"></span><span class="a2"></span><span class="a3"></span>
</div>

<div class="app" id="app">

  <!-- ============ SIDEBAR / LIBRARY ============ -->
  <aside class="sidebar glass" id="sidebar">
    <div class="side-head">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h6.2L18 8.3V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 3.6V9h5.4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <div class="brand-txt">
          <strong>قارئ PDF</strong>
          <span>مكتبتك</span>
        </div>
      </div>
      <button class="icon-btn ghost only-mobile" id="closeSidebar" title="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="side-actions">
      <button class="btn primary" id="openBtn">
        <svg viewBox="0 0 24 24" class="i"><path d="M12 5v14M5 12h14"/></svg>
        <span>فتح ملفات</span>
      </button>
      <button class="icon-btn glass-btn" id="sampleBtn" title="ملف تجريبي">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>

    <div class="search glass-inset">
      <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="searchInput" type="text" placeholder="ابحث في المكتبة" autocomplete="off" />
    </div>

    <div class="doc-list" id="docList"></div>

    <div class="side-foot">
      <span id="libCount">لا توجد ملفات</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar glass" id="topbar">
      <button class="icon-btn ghost only-mobile" id="menuBtn" title="المكتبة">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="doc-head">
        <div class="doc-head-title" id="docTitle">اختر ملفًا للبدء</div>
        <div class="doc-head-sub" id="docSub">—</div>
      </div>

      <div class="top-actions">
        <div class="seg" role="group" aria-label="نمط العرض">
          <button class="seg-btn active" data-fit="width" title="ملء العرض">
            <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/></svg>
          </button>
          <button class="seg-btn" data-fit="height" title="ملء الصفحة">
            <svg viewBox="0 0 24 24"><path d="M8 4H5a1 1 0 0 0-1 1v3M16 4h3a1 1 0 0 1 1 1v3M8 20H5a1 1 0 0 1-1-1v-3M16 20h3a1 1 0 0 0 1-1v-3"/></svg>
          </button>
        </div>

        <button class="pill-btn" id="darkPdfBtn" title="خلفية داكنة للملف">
          <svg viewBox="0 0 24 24" class="i"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Z"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor" stroke="none"/></svg>
          <span>خلفية داكنة</span>
        </button>

        <button class="pill-btn" id="nightBtn" title="وضع ليلي">
          <svg viewBox="0 0 24 24" class="i"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <span>وضع ليلي</span>
        </button>

        <button class="icon-btn ghost" id="bookmarkBtn" title="إشارة مرجعية">
          <svg viewBox="0 0 24 24"><path d="M6 4.5h12v15l-6-4-6 4v-15Z"/></svg>
        </button>

        <button class="icon-btn ghost" id="panelBtn" title="الإشارات المرجعية">
          <svg viewBox="0 0 24 24"><path d="M6 4.5h12v15l-6-4-6 4v-15Z"/><path d="M4 4h2M18 4h2M4 20h2M18 20h2"/></svg>
        </button>

        <button class="icon-btn ghost" id="closeDocBtn" title="إغلاق الملف">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </header>

    <section class="stage" id="stage">
      <!-- Empty state -->
      <div class="empty" id="emptyState">
        <div class="empty-art">
          <div class="glass-card c1"></div>
          <div class="glass-card c2"></div>
          <div class="glass-card c3">
            <svg viewBox="0 0 24 24"><path d="M7 3.5h6.2L18 8.3V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z" stroke-width="1.4" stroke-linejoin="round"/><path d="M13 3.6V9h5.4" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <h2>اسحب ملفات PDF هنا</h2>
        <p>أو اضغط على «فتح ملفات» لتبدأ القراءة بتصميم مريح ونظيف</p>
        <button class="btn primary" id="emptyOpenBtn">
          <svg viewBox="0 0 24 24" class="i"><path d="M12 5v14M5 12h14"/></svg>
          <span>افتح ملفًا</span>
        </button>
      </div>

      <div class="pages" id="pages"></div>
    </section>

    <!-- Floating page bar -->
    <div class="pagebar glass" id="pageBar" hidden>
      <button class="icon-btn" id="prevBtn" title="السابق">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="page-input">
        <input id="pageInput" type="text" inputmode="numeric" value="1" />
        <span id="pageTotal">/ 1</span>
      </div>
      <button class="icon-btn" id="nextBtn" title="التالي">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn" id="zoomOutBtn" title="تصغير">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="zoom-label" id="zoomLabel" title="إعادة الضبط">100%</button>
      <button class="icon-btn" id="zoomInBtn" title="تكبير">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Reading comfort controls -->
    <div class="comfort glass" id="comfort" hidden>
      <div class="comfort-head">
        <span>راحة القراءة</span>
        <button class="icon-btn ghost" id="closeComfort" title="إغلاق" style="width:28px;height:28px">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="comfort-row">
        <span>شدة الخلفية الداكنة</span>
        <input type="range" id="darkRange" min="0" max="100" value="88" />
      </div>
      <div class="comfort-row">
        <span>دفء الوضع الليلي</span>
        <input type="range" id="warmRange" min="0" max="100" value="35" />
      </div>
    </div>
  </main>

  <!-- ============ MARKS PANEL ============ -->
  <aside class="panel glass" id="panel">
    <div class="panel-head">
      <div class="tabs">
        <button class="tab active" data-tab="bookmarks">
          <svg viewBox="0 0 24 24" class="i"><path d="M6 4.5h12v15l-6-4-6 4v-15Z"/></svg><span>الإشارات</span>
        </button>
        <button class="tab" data-tab="highlights">
          <svg viewBox="0 0 24 24" class="i"><path d="M4 20h16M7 16l9-9-3-3-9 9v3h3Z"/></svg><span>التظليل</span>
        </button>
      </div>
      <button class="icon-btn ghost" id="closePanel" title="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

</div>

<!-- Selection action bubble -->
<div class="selection-menu glass" id="selectionMenu" hidden>
  <div class="swatches" id="swatches"></div>
  <button class="sm-action" id="smHighlight">تظليل</button>
  <button class="sm-action" id="smCopy">نسخ</button>
</div>

<input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />

<div class="toast" id="toast" hidden></div>

<div class="scrim" id="scrim" hidden></div>

<!-- ============ LOADING ============ -->
<div class="loader" id="loader" hidden>
  <div class="spinner"></div>
  <span id="loaderText">جارٍ فتح الملف…</span>
</div>

<script src="./vendor/pdf.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
